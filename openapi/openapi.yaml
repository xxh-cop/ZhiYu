        - {name: status, in: query, required: false, schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}, description: '核验状态过滤（大小写不敏感）；不传返回全部状态'}
      responses:
        '200': {description: 'Result，data 包含 records、total；仅 role 3'}
        '400': {description: 'status 非法或页码越界（code=1001）', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResult'}}}}
