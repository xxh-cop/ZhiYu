openapi: 3.0.3
info:
  title: 织愈 API
  version: 1.0.0
  description: |
    「织愈」后端接口契约。统一响应体：
    `{ code: 0, message: "操作成功", data: {} }`
    错误码见 AGENTS.md §3。对话接口使用 SSE（text/event-stream）。

    约定：
    - 除 SSE 接口外，所有接口的响应 body 统一包 Result。
    - SSE 接口（/api/emotion/chat）不使用 HTTP 层错误码，失败通过 `event: error` 推送，由前端降级。
    - 类型口径（S3 2026-11-04 统一）：雪花 ID 一律为字符串；列表接口的分页元数据（total/page/size/pageNum/pageSize）与列表内嵌计数（如 journey 的 completed/works、mine 的 counts、programs 的 booked）一律为 JSON number。
    - 例外（保持字符串，属只读展示统计指标而非列表分页元数据）：/api/admin/dashboard/stats、/api/admin/dashboard/operations、/api/admin/dashboard/therapy-funnel、/api/admin/ops/health、/api/admin/ai-governance/overview、/api/admin/ai-metrics 中的聚合计数按字符串返回（全局 Long→String 序列化策略）。前端展示可直接渲染；如需计算请先 Number() 转换。
servers:
  - url: http://localhost:8080
    description: 本地开发

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Result:
      type: object
      properties:
        code: { type: integer, default: 0, example: 0 }
        message: { type: string, default: 操作成功, example: 操作成功 }
        data: { description: 业务数据，结构随接口而定（对象/数组/标量均可） }

    ErrorResult:
      description: >-
        错误响应体，用于 401（未认证，code=1002）与 403（权限不足，code=1003）。
        这两种响应由 Spring Security 过滤器链在 DispatcherServlet 之前直接写出，
        不经过 GlobalExceptionHandler，但响应体格式与 Result 完全一致，且不是空体。
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            code: { type: integer, example: 1002 }
            data: { type: object, nullable: true, description: 错误响应不携带业务数据，固定为 null }

    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: student01 }
        password: { type: string, format: password }

    RegisterReq:
      type: object
      required: [username, password, nickname]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        nickname: { type: string }
        school: { type: string, maxLength: 100, nullable: true, description: 所在学校，可选 }

    PasswordForgotReq:
      type: object
      required: [username]
      properties:
        username: { type: string, example: student01 }

    PasswordResetReq:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: 一次性重置令牌，明文只出现在发送通道中 }
        newPassword: { type: string, format: password, minLength: 6, maxLength: 32 }

    NotificationVO:
      type: object
      description: '通知条目；正文为脱敏内容，id 以字符串传递（雪花 ID）'
      properties:
        id: { type: string, description: 通知 ID（雪花，字符串） }
        type: { type: string, enum: [WORK_AUDIT, COMMENT_AUDIT, BOOKING_REPLY, GROUP_JOIN, CARE_REMINDER, CAMPUS_AUDIT, SOFT_TIER_NOTICE] }
        title: { type: string }
        content: { type: string, nullable: true, description: '脱敏正文；关怀类只含引导语，不含敏感内容' }
        refType: { type: string, nullable: true, description: '关联对象类型：work/comment/booking/group/care_reminder/campus_verification/project/inheritor_profile（project：AY1 起下架/删除、BE 起审核结果；inheritor_profile：BG1 起传承人入驻核验结果，类型复用 CAMPUS_AUDIT）' }
        refId: { type: string, nullable: true, description: '跳转目标 ID（雪花，字符串）。COMMENT_AUDIT 自 2026-11-04（S2）起为评论所属作品 ID（此前历史数据经迁移回填；评论已物理缺失的极个别历史行可能仍为评论 ID，前端按 subRefId 是否存在判断可跳转性）' }
        subRefId: { type: string, nullable: true, description: '二级关联对象 ID（2026-11-04 S2 新增）。COMMENT_AUDIT 为评论 ID 锚点，学生端存在 subRefId 即可直达作品并锚定评论；其他类型为 null' }
        read: { type: boolean, description: 'true 已读 / false 未读' }
        createTime: { type: string, format: date-time }

    LoginVO:
      type: object
      description: 登录成功返回体
      properties:
        token: { type: string, description: JWT }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        role: { type: integer, description: 角色码，取值见 AGENTS.md §3.1（0学生 1传承人 2咨询师 3管理员） }

    UserVO:
      type: object
      description: 当前用户信息，不含密码
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, description: 登录名（学号或昵称） }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true, description: 头像 URL }
        school: { type: string, nullable: true }
        intro: { type: string, nullable: true, description: 个人简介 }
        privacyAgreed: { type: integer, description: '0 未同意 1 已同意' }
        role: { type: integer, description: 角色码，取值见 AGENTS.md §3.1（0学生 1传承人 2咨询师 3管理员） }

    UserProfileUpdateReq:
      type: object
      description: '更新个人资料请求，所有字段可选，null 表示不更新'
      properties:
        nickname: { type: string, maxLength: 50, nullable: true }
        avatarUrl: { type: string, maxLength: 255, nullable: true }
        school: { type: string, maxLength: 100, nullable: true }
        intro: { type: string, maxLength: 500, nullable: true }

    PasswordChangeReq:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 6, maxLength: 32 }

    UserCreateReq:
      type: object
      required: [username, password, nickname, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, format: password, minLength: 6, maxLength: 32 }
        nickname: { type: string, maxLength: 50 }
        role: { type: integer, minimum: 0, maximum: 3, description: '0学生 1传承人 2咨询师 3管理员' }
        school: { type: string, maxLength: 100, nullable: true }
        intro: { type: string, maxLength: 500, nullable: true }
        avatarUrl: { type: string, maxLength: 255, nullable: true }
        skill: { type: string, maxLength: 100, nullable: true, description: '传承人专用（role=1 时可选）' }
        honor: { type: string, maxLength: 255, nullable: true, description: '传承人专用（role=1 时可选）' }

    ChatReq:
      type: object
      required: [content]
      properties:
        sessionId: { type: integer, nullable: true }
        mood: { type: string, nullable: true }
        content: { type: string, example: 今天考试周压力很大 }
        mode:
          type: string
          nullable: true
          enum: [live]
          description: '传 live 启用句级真流式事件协议（chunk/revoke/done）；缺省保持旧版整段单事件格式（兼容期一个迭代周期）'

    NoteCreateDTO:
      type: object
      required: [content]
      properties:
        mood: { type: string, nullable: true, description: 情绪 code（不加密） }
        content: { type: string, description: 便签内容（明文，Service 层加密存储） }
        noteDate: { type: string, format: date, nullable: true, description: 记录日期，默认今天 }

    NoteUpdateDTO:
      type: object
      properties:
        mood: { type: string, nullable: true, description: 情绪 code，null 表示不更新 }
        content: { type: string, nullable: true, description: 便签内容，null 不更新；非空则重新加密 }

    NoteListItemVO:
      type: object
      description: 便签列表项
      properties:
        id: { type: integer, format: int64 }
        mood: { type: string, nullable: true }
        noteDate: { type: string, format: date, nullable: true }
        createTime: { type: string, format: date-time }
        excerpt: { type: string, description: 解密后内容的前 30 字摘要 }

    NoteDetailVO:
      type: object
      description: 便签详情
      properties:
        id: { type: integer, format: int64 }
        mood: { type: string, nullable: true }
        content: { type: string, description: 解密后的明文内容 }
        noteDate: { type: string, format: date, nullable: true }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }

    NotePageVO:
      type: object
      description: 便签分页响应
      properties:
        total: { type: integer, format: int64 }
        pageNum: { type: integer }
        pageSize: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/NoteListItemVO' }

    HeartbeatReq:
      type: object
      description: |
        步骤心跳：只上报步骤推进与心流信号，不修改会话主状态机。
        主状态机流转请使用 PUT /api/craft/session/{id}/status。
      required: [stepNo, dwellSeconds]
      properties:
        stepNo: { type: integer, description: 当前步骤序号 }
        dwellSeconds: { type: integer, description: 在本步骤停留秒数 }
        isExited: { type: boolean, description: 是否主动退出 }
        isBreathingResponded: { type: boolean, description: 是否响应了呼吸提醒 }

    HeartbeatResult:
      description: 心跳响应，统一包 Result，data 为心流判定信号
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                inFlow: { type: boolean, description: 是否处于心流状态（连续 5 分钟无步骤切换且未主动退出） }
                needBreathing: { type: boolean, description: 是否需要呼吸引导（焦躁：同一步骤反复停留>3 次且未响应呼吸提醒） }
                stuckGuide: { type: string, nullable: true, description: '卡点引导文案（2026-11-05 卡点引导，可空）。仅在 DWELL_STAGNATION 触发后的后续心跳携带一次：轻提示、不阻塞、可一键收起、可经 PUT /api/craft/stuck-guide/setting 永久关闭；null 表示本次无引导。AI 生成失败/超时/熔断时为静态模板文案，永不为空串。文案为可选动作建议，非诊断、非状态判定。' }

    SessionEventItem:
      type: object
      description: 会话行为事件条目（2026-11-05 心流度量配套）
      required: [eventType, occurredAt, clientSeq]
      properties:
        eventType:
          type: string
          description: '事件类型（仅客户端白名单）：step_enter / step_leave / step_advance / step_backtrack / heartbeat / audio_play / visibility_change / app_lifecycle / breathing_responded / export；服务端派生类型（dwell_stagnation / suspected_away / breathing_prompt / session_finish / session_abandon / session_archive / step_gate_blocked / stuck_guide_shown）上报即 1001'
        stepNo: { type: integer, nullable: true, description: 相关步骤序号（会话级事件可空） }
        occurredAt: { type: string, format: date-time, description: 事件发生时刻（允许 5 分钟时钟偏移，超前过多计 failed） }
        clientSeq: { type: integer, format: int64, minimum: 1, description: 客户端序号（每会话单调递增），与服务端组成 (session_id, client_seq) 幂等去重键 }
        context:
          type: object
          nullable: true
          description: '脱敏上下文（≤20 个标量键值）：值仅允许数字/布尔/≤64 字符字符串；step_leave 建议携带 dwellSeconds（数字，提取成列供 P95 统计）；visibility_change 建议 visible（布尔）；app_lifecycle 建议 foreground（布尔）；禁止对话或自由文本'
          additionalProperties: true

    SessionEventBatchReq:
      type: object
      description: 会话行为事件批量上报请求（1-100 条，超出整体 1001）
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SessionEventItem' }

    SessionEventBatchResult:
      description: 事件批量上报受理结果，统一包 Result
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                accepted: { type: integer, description: 新入库条数 }
                deduped: { type: integer, description: 重复 client_seq 去重条数（幂等，不算错误） }
                failed: { type: integer, description: 时钟超前等不可接受而丢弃的条数 }

    LikeResult:
      description: 点赞/收藏 toggle 结果，统一包 Result，data.active 表示本次请求后的状态
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                active: { type: boolean, description: true=已点赞/已收藏；false=本次请求执行了取消 }

    WorkPublishReq:
      type: object
      required: [title]
      properties:
        sessionId: { type: integer, nullable: true }
        title: { type: string }
        message: { type: string, nullable: true, description: AI 寄语，可由系统生成 }
        visible: { type: integer, enum: [0, 1, 2], description: 0私密 1公开 2仅指定小组, default: 1 }
        groupId: { type: string, pattern: '^[1-9][0-9]{0,18}$', nullable: true, description: visible为2时必填，必须属于当前有效小组 }
        mediaType: { type: string, enum: [image, video, text], default: image }
        coverUrl: { type: string, nullable: true, description: 小组图片须使用受保护媒体引用，禁止外部公开图片链接 }
        videoUrl: { type: string, nullable: true, description: 本人上传的视频引用，视频发布后须审核 }
        anonymous:
          type: boolean
          default: true
          description: 后端仍存 user_id，anonymous 仅控制展示层；true 时展示为「匿名同学」。与 visible 正交共存。

    CraftStepVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepNo: { type: integer, description: 步骤序号 }
        title: { type: string, description: 步骤标题 }
        guide: { type: string, description: 引导语 }
        audioUrl: { type: string, nullable: true, description: '引导语音频：私有媒体引用在下发时换为 1h 签名播放地址（/api/media/{id}/content?uid=&expires=&signature=）；http(s) 外链与 /static/ 前端包静态资源原样透传；音频资产 missing/disabled 或无音频时为 null' }

    CraftProjectStepsVO:
      type: object
      description: '项目步骤结构化视图（2026-11-05 分层下架）：上架项目正常下发；下架/归档项目返回步骤（可回看）+ 会话状态 + 只读/导出标记 + 截止时间 + 提示语，不再 1004'
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/CraftStepVO' }
        projectStatus: { type: integer, description: '有效项目状态：1 上架 / 2 下架 / 3 归档（窗口或期限已过的下架按 3 下发）' }
        sessionId: { type: string, nullable: true, description: '当前用户在该项目最近一个会话 ID（雪花，字符串；无则 null）' }
        sessionStatus: { type: integer, nullable: true, description: '当前用户在该项目最近一个会话状态：0待开始 1进行中 2已暂停 3已完成 4已放弃（无则 null）' }
        readOnly: { type: boolean, description: '会话只读：true 时心跳推进步骤被拒（code=3001）' }
        canReview: { type: boolean, description: '可回看历史步骤（下架/归档均为 true）' }
        canExport: { type: boolean, description: '当前可导出创作数据（合规下架窗口内且导出开关开）' }
        exportUntil: { type: string, format: date-time, nullable: true, description: '私有导出/只读窗口截止（合规下架）' }
        archiveAt: { type: string, format: date-time, nullable: true, description: '归档时间/截止（运营下架为预定截止；已归档为实际归档时间）' }
        noticeKey: { type: string, nullable: true, description: '提示语模板 key（craft-takedown-compliance / craft-takedown-operational / craft-archived），前端条件渲染用' }
        notice: { type: string, nullable: true, description: '渲染后的提示文案（发生了什么 + 截止时间 + 能做什么）；模板缺失时为 null，前端用 noticeKey 兜底' }

    CraftProject:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        intro: { type: string }
        cultureBg: { type: string }
        level: { type: integer, description: 1入门 2进阶 3高阶 }
        estMinutes: { type: integer }
        category: { type: string, description: 技艺品类，取值见 dict_category.label }
        therapyTags: { type: array, items: { type: string }, description: 疗愈效果标签，词表见 dict_therapy_tags }

    CommentReq:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 255 }

    WorkVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        coverUrl: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true, description: 平台上传的视频稳定引用 }
        message: { type: string, nullable: true }
        authorName: { type: string, description: 匿名时为"匿名同学" }
        anonymous: { type: boolean }
        visible: { type: integer, enum: [0, 1, 2] }
        liked: { type: boolean, description: 详情接口返回当前用户是否已点赞 }
        favorited: { type: boolean, description: 详情接口返回当前用户是否已收藏 }
        shareable: { type: boolean, description: 仅审核通过且公开的作品可分享，接收者仍需登录且重新校验访问权限 }
        status: { type: integer, enum: [0, 1, 2], description: '审核状态（N1 先审后发）：0 待审（仅作者可见）/ 1 已公开 / 2 已下架；他人访问非 1 的作品返回 1004（不泄露存在性），与 auditReason 可见性口径一致' }
        auditReason: { type: string, nullable: true, description: '审核理由（AE2 2026-11-04）：仅 GET /api/works/{id} 对作者本人下发；他人不下发（非公开作品对他人为 1004）；未审核/已通过为 null' }
        softDemoteUntil: { type: string, format: date-time, nullable: true, description: '软档降权截止（2026-11-07 处置链）：作者本人视角下发（GET /api/works/{id} 与 GET /api/works/mine），「展示受限」徽标数据源（反静默折叠）；仅在处置链开关开启 + 本人 + 降权未过期三条件同时成立时下发，其余情况为 null 或不出现' }
        likeCount: { type: integer }
        commentCount: { type: integer }
        createTime: { type: string, format: date-time }

    WorkPageVO:
      type: object
      properties:
        total: { type: integer, description: '总数为 JSON number（AE3 2026-11-04，与 PageVO 口径一致）；records 内 id 仍为字符串雪花' }
        page: { type: integer }
        size: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/WorkVO' }

    CommentVO:
      type: object
      description: 新评论待审核，列表仅返回公开评论及本人评论。
      properties:
        id: { type: integer, format: int64 }
        status: {type: integer, enum: [0, 1, 2], description: '0 待审核，1 已公开，2 已隐藏'}
        mine: {type: boolean, description: 是否为当前用户的评论}
        softDemoteUntil: { type: string, format: date-time, nullable: true, description: '软档降权截止（2026-11-07 处置链）：口径与作品侧完全一致——仅当前用户本人评论 + 处置链开关开启 + 降权未过期三条件同时成立时下发；他人评论与已过期不下发' }
        content: { type: string }
        authorName: { type: string }
        createTime: { type: string, format: date-time }

    CommentPageVO:
      type: object
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/CommentVO' }

    LikeVO:
      type: object
      properties:
        active: { type: boolean, description: 本次请求后是否处于已点赞/已收藏状态 }

    GroupCreateReq:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        maxCount: { type: integer, minimum: 1, maximum: 500, default: 50 }

    GroupVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        maxCount: { type: integer }
        memberCount: { type: integer }
        status: { type: integer, enum: [0, 1] }
        joined: { type: boolean, description: 当前用户是否已加入 }
        myRole: { type: string, nullable: true, description: 成员/组长/null（未加入） }

    RecommendItemVO:
      type: object
      properties:
        projectId: { type: string, pattern: '^[0-9]+$', description: 雪花/种子 ID，按字符串返回避免 JS 精度丢失 }
        title: { type: string }
        intro: { type: string }
        cultureBg: { type: string }
        level: { type: integer }
        estMinutes: { type: integer }
        therapyTags: { type: string }
        coverUrl: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true, description: 平台上传的视频稳定引用 }
        score: { type: number, format: double }
        reason: { type: string }

    RecommendVO:
      type: object
      properties:
        recommendationId: { type: string, pattern: '^[0-9]+$', description: 雪花 ID，按字符串返回避免 JS 精度丢失 }
        mood: { type: string }
        reason: { type: string, description: 整体推荐理由 }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecommendItemVO' }

    RecommendClickDTO:
      type: object
      required: [recommendationId, projectId, source]
      properties:
        recommendationId: { type: string, pattern: '^[0-9]+$' }
        projectId: { type: string, pattern: '^[0-9]+$' }
        source: { type: string, enum: [HOME, RECOMMEND], description: 首页或推荐页入口 }
        eventType: { type: string, enum: [CLICK, DISMISS], default: CLICK, description: '事件类型（AM2 2026-11-04）：缺省 CLICK 正反馈；DISMISS 负反馈，参与回灌加权' }

    TherapyFunnelStageVO:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        users: { type: integer, format: int64 }
        fromPrevious: { type: number, format: double, nullable: true, description: 相对上一阶段转化率；上一阶段为 0 时为 null }
        fromStart: { type: number, format: double, nullable: true, description: 相对首阶段 cohort 的转化率；cohort 为 0 时为 null }

    TherapyFunnelFlowVO:
      type: object
      properties:
        completedSessions: { type: integer, format: int64 }
        flowSeconds: { type: integer, format: int64 }
        focusRate: { type: number, format: double, nullable: true, description: 完成会话心流秒数 / 总时长秒数；无有效时长时为 null }

    TherapyFunnelVO:
      type: object
      properties:
        days: { type: integer }
        cohort: { type: integer, format: int64 }
        insufficient: { type: boolean, description: cohort 少于 5 时为 true，转化率为 null }
        stages:
          type: array
          items: { $ref: '#/components/schemas/TherapyFunnelStageVO' }
        flow: { $ref: '#/components/schemas/TherapyFunnelFlowVO' }
        generatedAt: { type: string, format: date-time }

    CreateSessionDTO:
      type: object
      required: [projectId]
      properties:
        projectId: { type: integer, format: int64, description: 手作项目 ID }

    SessionStatusDTO:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, finish, abandon], description: '无 start；创建即为进行中' }

    CraftSessionVO:
      type: object
      properties:
        sessionId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        projectTitle: { type: string, description: 项目标题（join craft_project 取） }
        status: { type: integer, description: '0待开始 1进行中 2已暂停 3已完成 4已放弃' }
        statusLabel: { type: string, description: '状态中文标签' }
        currentStep: { type: integer }
        totalSteps: { type: integer, description: '项目总步骤数（count craft_step）' }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }


    PrivacyStatusVO:
      type: object
      description: 隐私政策状态
      properties:
        privacyAgreed: { type: integer, description: '隐私政策是否同意：0未同意 1已同意' }
        canContact: { type: integer, description: '是否允许心理咨询师联系：0不允许 1允许' }

    CanContactReq:
      type: object
      required: [canContact]
      properties:
        canContact: { type: integer, description: '0不允许 1允许心理咨询师联系' }

    DeleteAccountReq:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, description: '二次确认，必须为 true 才执行注销' }

    HotlinesVO:
      type: object
      description: 心理援助热线信息
      properties:
        psychCenterPhone: { type: string, description: 学校心理中心电话 }
        nationalHotline: { type: string, description: 全国心理援助热线号码 }
        psychCenterName: { type: string, description: 学校心理中心名称 }
        nationalHotlineName: { type: string, description: 全国心理援助热线名称 }

    ListeningSummaryVO:
      type: object
      description: 独立倾听小结；生成与保存分离，保存后加密写入 wellbeing_record
      properties:
        saved: { type: boolean, description: '是否已有保存记录；未保存的生成结果不落库' }
        summary: { type: string, maxLength: 300, description: '小结文本；未保存或未生成时可为空' }
        generated: { type: boolean, description: '是否由生成模型产出；false 时为固定记录引导或安全提示' }
        safetyHold: { type: boolean, description: '会话是否包含需要优先照顾的安全信号；true 时不允许保存 AI 小结' }
        savedAt: { type: string, description: '保存时间（ISO-8601）' }

    CreatePracticeSessionReq:
      type: object
      required: [kind, minutesBudget]
      properties:
        kind:
          type: string
          enum: [HERITAGE, CRAFT, MINDFULNESS, DRAWING]
          description: '练习类型'
        moodCode: { type: string, maxLength: 32, description: '可选情绪代码' }
        minutesBudget: { type: integer, minimum: 1, maximum: 180, description: '用户选择的可用时间' }
        heritagePatternId: { type: string, maxLength: 32, description: '可选纹样目录 ID，按字符串传递' }

    PracticeSessionStatusReq:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [START_LISTENING, RECOMMEND, START, PAUSE, RESUME, COMPLETE, SAVE_ARTIFACT, ABANDON]
          description: '练习状态动作；非法流转返回 code 3001'

    SavePracticeArtifactReq:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean, description: '必须为 true 才会保存' }
        structureLabel: { type: string, maxLength: 100, description: '本次观察到的结构说明' }
        notes: { type: string, maxLength: 500, description: '用户备注，可为空' }
        palette:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }

    AdaptivePlanVO:
      type: object
      description: 规则驱动的自适应练习计划，不是模型生成
      properties:
        minutes: { type: integer }
        levelBias: { type: string, enum: [入门, 进阶] }
        completionRate: { type: number }
        completedCount: { type: integer }
        abandonedCount: { type: integer }
        source: { type: string, enum: [MANUAL, MEMORY, DEFAULT] }
        historyUsed: { type: boolean }
        generated: { type: boolean, example: false }
        reason: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              patternId: { type: string }
              name: { type: string }
              traditionName: { type: string }
              family: { type: string }
              familyLabel: { type: string }
              minutes: { type: integer }
              level: { type: string }
              learningFocus: { type: string }
              palette:
                type: array
                items: { type: string }
              reason: { type: string }

    PracticeArtifactVO:
      type: object
      description: 练习成果；未保存时仅返回 saved=false
      properties:
        saved: { type: boolean }
        practiceSessionId: { type: string }
        patternId: { type: string }
        patternName: { type: string }
        traditionName: { type: string }
        region: { type: string }
        family: { type: string }
        familyLabel: { type: string }
        level: { type: string }
        minutesBudget: { type: integer }
        structureLabel: { type: string }
        palette:
          type: array
          items: { type: string }
        learningFocus: { type: string }
        designNote: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              organization: { type: string }
              url: { type: string }
              mediaReuse: { type: string }
        notes: { type: string }
        listeningSummary: { type: string, nullable: true }
        disclaimer: { type: string }
        savedAt: { type: string }

    CompanionMemoryToggleReq:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        consent: { type: boolean, description: '开启时必须为 true' }

    CompanionMemorySaveReq:
      type: object
      required: [consent, preferences]
      properties:
        consent: { type: boolean, description: '必须为 true' }
        preferences:
          type: object
          additionalProperties: false
          properties:
            preferred_minutes: { type: string, pattern: '^[0-9]+$', description: '1-180 分钟的整数' }
            preferred_material: { type: string, enum: [bamboo, thread, paper, porcelain] }
            preferred_pattern_family: { type: string, enum: [stitch, weave, cutout, porcelain] }

    CompanionMemoryVO:
      type: object
      properties:
        enabled: { type: boolean }
        ttlDays: { type: integer, example: 180 }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: string }
              valueLabel: { type: string }
        disclaimer: { type: string }

    CompanionMessageReq:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
          description: '用户本轮想说的话；只用于当前练习会话，不保存原始对话'

    PracticeSessionVO:
      type: object
      description: 统一练习会话；把情绪、非遗练习、正念/绘色挂到同一次练习
      properties:
        practiceSessionId: { type: string, description: '雪花 ID，字符串返回' }
        kind: { type: string, enum: [HERITAGE, CRAFT, MINDFULNESS, DRAWING] }
        status: { type: integer, description: '0 CREATED 1 LISTENING 2 RECOMMENDED 3 PRACTICING 4 PAUSED 5 COMPLETED 6 ARTIFACT_SAVED 7 ABANDONED' }
        statusLabel: { type: string }
        moodCode: { type: string, nullable: true }
        minutesBudget: { type: integer }
        emotionSessionId: { type: string, nullable: true }
        craftSessionId: { type: string, nullable: true }
        heritagePatternId: { type: string, nullable: true }
        currentStep: { type: integer }
        startedAt: { type: string, nullable: true }
        completedAt: { type: string, nullable: true }
        createTime: { type: string, nullable: true }

    InheritorProfileSelfVO:
      type: object
      description: 传承人自己的资料返回体
      properties:
        id: { type: integer, format: int64, description: inheritor_profile 主键 }
        userId: { type: integer, format: int64, description: 关联用户 ID }
        skill: { type: string, description: 擅长技艺 }
        intro: { type: string, description: 个人简介 }
        honor: { type: string, description: 荣誉头衔 }
        verified: { type: integer, description: '0 未认证 / 1 已认证' }
        avatarUrl: { type: string, description: '头像 URL（来自 user 表）' }

    InheritorProfileSelfUpdateReq:
      type: object
      description: 传承人自更新资料请求体（所有字段可选，null 表示不更新）
      properties:
        skill: { type: string, maxLength: 100, description: 擅长技艺 }
        intro: { type: string, maxLength: 500, description: 个人简介 }
        honor: { type: string, maxLength: 255, description: 荣誉头衔 }
        avatarUrl: { type: string, maxLength: 255, description: '头像 URL，非空时同步更新 user.avatar_url' }

    UserStatsVO:
      type: object
      description: 学生端「我的」统计数据
      properties:
        daysSinceRegister: { type: integer, format: int64, description: '注册天数（今天注册返回 1）' }
        workCount: { type: integer, format: int64, description: '作品数' }
        noteCount: { type: integer, format: int64, description: '便签数' }

    RagAskReq:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500, description: '用户问题' }

    RagAnswerVO:
      type: object
      description: RAG 问答返回体
      properties:
        answer: { type: string, description: '回答文本；generated=false 时为结构化摘录或降级提示' }
        sources:
          type: array
          description: 引用的知识库来源列表
          items: { $ref: '#/components/schemas/RagSourceVO' }
        retrievalMode:
          type: string
          enum: [GRAPH_VECTOR, STRUCTURED_GRAPH, VECTOR, NONE]
          description: '检索模式；STRUCTURED_GRAPH 表示未使用向量服务，NONE 表示未找到可引用资料'
        generated:
          type: boolean
          description: '是否由生成模型产出；false 时回答为结构化摘录或降级提示'

    RagSourceVO:
      type: object
      description: RAG 引用来源
      properties:
        id: { type: string, description: '稳定来源/切片 ID（字符串）' }
        title: { type: string, description: '来源标题或文件名' }
        excerpt: { type: string, description: '内容摘要（前 80 字）' }
        url: { type: string, nullable: true, description: '已登记来源链接；检索参考为空' }
        organization: { type: string, nullable: true, description: '来源机构；检索参考为空' }
        mediaReuse: { type: string, nullable: true, description: '媒体再利用状态；NOT_GRANTED 时仅作背景参考' }
        sourceVersion: { type: string, description: '目录版本或语料指纹' }
        relation: { type: string, nullable: true, description: '关系链，例如 工艺 → 来源' }
        citationType:
          type: string
          enum: [VERIFIED_SOURCE, REFERENCE]
          description: 'VERIFIED_SOURCE 为已登记来源，REFERENCE 为检索参考'

paths:
  /api/growth/material-kits:
    get:
      operationId: growthMaterialKits
      summary: 读取 3 份工作坊材料包
      description: '登录用户可读。返回与 3 个工作坊模板对应的材料、工具、准备步骤、安全提示与无材料替代方案；不含采购链接或价格，数量需按实际人数调整。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Result.data 为 MaterialKitCatalog，含 disclaimer 与 3 份材料包
        '401':
          description: 未登录，HTTP 401 + code 1002
  /api/growth/workshop-templates:
    get:
      operationId: growthWorkshopTemplates
      summary: 读取 3 个团体工作坊模板
      description: '仅活动带领者（ROLE 1/2/3）可读。返回模板标题、流程、材料、安全提示与来源说明；模板只用于预填活动，创建时仍走活动字段校验。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Result.data 为 WorkshopTemplateCatalog，含 disclaimer 与 3 条模板
        '403':
          description: 非活动带领者，code 1003
  /api/growth/programs/{id}/feedback:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      operationId: growthProgramsByIdFeedbackGet
      summary: 查看本人的活动反馈及填写资格
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Result.data 包含 title、kind、eligible、reason、feedback；feedback 为本人评分及私密笔记或 null'}
    put:
      operationId: growthProgramsByIdFeedbackPut
      summary: 已签到参加者在活动结束后保存反馈
      description: 一人一份，可修改；评分和笔记加密存储。笔记仅本人可见，非一对一活动达到五份反馈后向主办人提供评分汇总。未授权、未签到、未结束或取消活动不可提交。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, consent]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                note: {type: string, maxLength: 1000}
                consent: {type: boolean, enum: [true]}
      responses:
        '200': {description: Result}
        '403': {description: '未同意隐私政策（code=1003「请先阅读并同意隐私政策」，S1 2026-11-04 起全站统一文案）'}
    delete:
      operationId: growthProgramsByIdFeedbackDelete
      summary: 删除本人反馈正文并停止计入汇总
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Result}
  /api/growth/programs/{id}/feedback-summary:
    get:
      operationId: growthProgramsByIdFeedbackSummaryGet
      summary: 主办人或管理员查看评分汇总，不返回个人笔记
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: 'Result.data 包含 visible、count、minimum=5、reason；visible=true 时包含 average、distribution。少于五份、一对一或取消活动不返回评分。'}
        '403': {description: 非主办人或管理员}
  /api/works/mine:
    get:
      operationId: worksMineGet
      summary: 查看本人所有未撤回作品及审核状态
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: status, schema: {type: integer, enum: [0, 1, 2]}}
      responses:
        '200': {description: 'Result.data 含 records、total、counts。每页 12 条，id 为字符串；状态 0 待审核、1 正常、2 已下架；visible=0 仅自己可见。records 含 softDemoteUntil（2026-11-07 处置链，仅处置链开启且降权未过期时有值，「展示受限」徽标数据源）。'}
        '401': {description: 未登录}
  /api/works/{id}/withdraw:
    post:
      operationId: worksByIdWithdrawPost
      summary: 作者撤回作品及其评论互动
      description: 逻辑删除本人作品、相关评论和点赞收藏，评论正文清除；社区详情与互动不可访问。视频文件可被其他作品复用，不在此删除原文件；视频访问按当前公开引用重新鉴权。撤回不可恢复。
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: Result}
        '403': {description: 不可撤回他人作品}
        '404': {description: 作品已不存在}
  /api/admin/comments:
    get:
      operationId: adminCommentsGet
      summary: 管理员分页查看评论审核队列（可按作品过滤）
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: status, schema: {type: integer, enum: [0, 1, 2], default: 0}}
        - {in: query, name: workId, required: false, schema: {type: string, pattern: '^[0-9]+$'}, description: '可选（2026-11-04 O2 新增）；按所属作品过滤，管理端视角不受学生端 WorkAudience 限制'}
      responses:
        '200': {description: 'Result.data 包含 records、total（JSON number）；状态 0 待审核、1 公开、2 隐藏'}
        '403': {description: 仅管理员可访问}
  /api/admin/comments/{id}:
    get:
      operationId: adminCommentDetail
      summary: '管理端评论详情（脱敏摘要，2026-11-04 O2）'
      description: '返回评论所属 workId、当前状态、作者昵称与内容截断摘要（≤50 字，不返回全文），供审核工作台与通知跳转定位。权限 role∈{2,3}；评论不存在或已删除返回 1004。id 与 workId 以字符串返回（雪花）。'
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      responses:
        '200': {description: 'code=0；data 含 id/workId/status/authorName/contentExcerpt/createTime'}
        '401': {description: 未登录（code=1002）}
        '403': {description: 仅管理员/咨询师可访问（code=1003）}
        '404': {description: 评论不存在或已删除（code=1004）}
  /api/admin/comments/{id}/review:
    post:
      operationId: adminCommentsByIdReviewPost
      summary: 审核评论并记录管理操作
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedStatus]
              properties:
                status: {type: integer, enum: [1, 2]}
                expectedStatus: {type: integer, enum: [0, 1, 2]}
                reason: {type: string, maxLength: 255, description: '审核理由；status=2（隐藏/驳回）时必填，缺失返回 1001；status=1 可空。落库到 work_comment.audit_reason 并随通知正文送达评论作者'}
                softTier: {type: boolean, description: '软档标记（2026-11-07 处置链）：true 仅允许随 status=1 使用；处置链开关关闭时返回 1001 且状态变更整体回滚'}
                narrative: {type: string, maxLength: 20, description: '管理端回显的 AI 建议 narrative 值（可空）'}
                riskPointsNonEmpty: {type: boolean, description: '管理端回显的 AI 建议 riskPoints 是否非空（抽样信号，可空）'}
      responses:
        '200': {description: 'Result，0 成功，3001 状态已变化，1001 驳回缺少理由；已删除或下架作品不可通过评论'}
        '403': {description: 仅管理员可访问}
  /api/works/{id}/comments/{commentId}:
    delete:
      operationId: worksByIdCommentsByCommentIdDelete
      summary: 作者撤回自己的评论并清除正文
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
