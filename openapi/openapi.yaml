  /api/admin/dashboard/operations:
    get:
      operationId: adminDashboardOperationsGet
      tags: [Admin]
      summary: 管理员运营图表汇总
      description: '数据库实时聚合，Asia/Shanghai 自然日；所有查询排除逻辑删除。返回 totals、daily（date/users/works/sessions/finished）、categories、projectStates、sessionStates、programKinds、bookingStates、generatedAt。分类元素为 name/value。仅管理员可访问，不包含个人身份或心理原文。'
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            enum: [7, 30]
            default: 7
          description: 日趋势窗口；其他分布为当前全部记录
      responses:
        '200':
          description: Result.data 图表聚合；空日期补零，空分布不填造数据
        '400':
          description: 不支持的时间范围，code 1001
        '403':
          description: 非管理员，code 1003
