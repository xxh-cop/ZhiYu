      description: '仅媒体上传者本人可删，且仅当媒体未被任何内容引用。删除语义与孤儿退役一致：逻辑注销 media_asset + 登记 file_cleanup_job（PRIVATE），物理删除由 FileCleanupWorker 异步重试。被引用（craft_step.audio_url / craft_project.video_url|cover_url / work.video_url|cover_url）时不删除并返回 3001（HTTP 200 业务失败）。'
