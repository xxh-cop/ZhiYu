  /api/admin/crisis-logs:
    get:
      operationId: adminCrisisLogsGet
      summary: 危机路径留存列表（AJ 2026-11-04，仅元数据；AQ1 统一 camelCase）
      description: '危机路径「留存但降级」：列表只返回元数据（camelCase：id/userId/sessionId/scene/riskLevel/createTime），不含摘要。riskLevel 分级（AQ2）：1 关注 / 2 高危 / 3 紧急，按词表分组标记（# @level:N），未知命中保守取 3。仅 role 2/3；咨询师仅能看其认领关怀个案关联用户的记录（叠加 care_case 归属过滤）。学生端无入口。'
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: 'Result，data 含 records（元数据）与 total（JSON number）；每页 20 条'}
        '403': {description: 无权限（code=1003）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResult'}}}}
  /api/admin/crisis-logs/{id}:
    get:
      operationId: adminCrisisLogsByIdGet
      summary: 危机留存详情（含脱敏摘要 + 用户标识；每次查看落操作审计）
      description: '返回服务端解密后的规则式脱敏摘要（不含对话原文）。字段 camelCase：id/userId/sessionId/scene/riskLevel/summary/createTime。用户标识为 userId（雪花字符串）——按个案归属定位已足够，昵称/姓名属多余暴露（AQ1 最小权限）。仅 role 2/3 且叠加关怀范围过滤；越权或不存在返回 1004（不泄露存在性）。每次查看写 admin_operation_log（crisis_log.view）。'
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, description: '记录 ID（雪花，字符串）'}
      responses:
        '200': {description: 'Result，data 含 id/sessionId/scene/riskLevel/summary/createTime'}
        '403': {description: 无权限（code=1003）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResult'}}}}
        '404': {description: 不存在或无权查看（code=1004）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResult'}}}}

  /api/admin/campus-verifications:
    get:
      operationId: adminCampusVerificationsGet
      summary: 管理员分页查看校园身份申请
      description: 'AG1（2026-11-04）新增可选 status 过滤：不传或空白时返回全状态混排（与旧行为完全一致）；非法值返回 400 + code=1001。排序固定 update_time DESC,id DESC，每页 20 条，total 为 JSON number'
      parameters:
