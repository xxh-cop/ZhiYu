              properties:
                title: {type: string, maxLength: 100}
                chapter: {type: string, maxLength: 100}
                position: {type: integer, minimum: 1, maximum: 999}
                content: {type: string, maxLength: 10000}
                projectId: {type: integer, format: int64, nullable: true}
                published: {type: boolean}
      responses:
        '200': {description: 'Result，data.id 为新增课节编号'}
  /api/growth/programs/{id}/lessons/{lessonId}:
