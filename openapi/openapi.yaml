      description: '登录学生可读的只读目录，data 包含 version、disclaimer、sources（4 条已登记官方来源）、traditions（4 门工艺）、patterns（24 个原创教学纹样）。所有 ID 均为字符串，前端不得转为 JavaScript Number。纹样 origin 固定为 ORIGINAL_STUDY，表示原创教学再设计而非传统原作；来源仅作材料与技艺背景参考，不代表官方认可本图案。source.mediaReuse=NOT_GRANTED 表示项目页未明示媒体再利用许可，公开可读不等于允许复制图片或整篇文字。目录不连数据库、不返回用户数据，也不作医疗诊断。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Result.data 为目录对象，含 version、disclaimer、4 条 sources、4 门 traditions、24 个 patterns；pattern 含 id（字符串）、traditionId、name、family、variant、detail、palette（四色）、origin、sourceIds、designNote、learningFocus、minutes、level'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: string }
                          disclaimer: { type: string }
                          sources:
                            type: array
                            items: { type: object }
                          traditions:
                            type: array
                            items: { type: object }
                          patterns:
                            type: array
                            items: { type: object }
        '401':
          description: 未登录或登录已过期，HTTP 401 + code 1002
        '403':
          description: 账号不可用或权限不足，HTTP 403 + code 1003
  /api/heritage/co-create:
    post:
      operationId: heritageCoCreate
      tags: [Heritage, AI]
      summary: 受控非遗纹样共创（三变体）
      description: '登录学生显式同意本次 AI 共创后调用。模型只能输出 JSON 中的 variant、detail（4..12）、paletteId、name（≤30 字）与 rationale（≤200 字），服务端按当前纹样 family 的白名单变体与本次提供的 4 组色板校验；任何越界、重复组合、非 JSON 或模型不可用都整组回退为内置三变体（generated=false）。不接收或执行 SVG/HTML/颜色文本，不写库、不保存作品，也不生成诊断或疗效结论。'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patternId, consent]
              properties:
                patternId:
                  type: string
                  description: 目录中的纹样 ID，按字符串传递
                theme:
                  type: string
                  maxLength: 120
                  description: 可选的共创主题，服务端去首尾空白后限 120 字
                consent:
                  type: boolean
                  description: 必须为 true，表示同意本次将纹样名称与主题发送给 AI；不持久化该授权
      responses:
        '200':
          description: 'Result.data 含 variants（3 个，各含 id、name、family、variant、detail、palette 四色、rationale）、generated 与 message；generated=false 表示模型不可用或输出越界后使用内置变体'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          variants:
                            type: array
                            items: { type: object }
                          generated: { type: boolean }
                          message: { type: string }
        '400':
          description: 未选择纹样、未同意授权或主题超过 120 字，code 1001
        '401':
          description: 未登录或登录已过期，HTTP 401 + code 1002
        '403':
          description: 账号不可用或权限不足，HTTP 403 + code 1003
        '404':
          description: 纹样不存在，code 1004
