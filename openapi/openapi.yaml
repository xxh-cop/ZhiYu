    get:
      operationId: adminStarterQualityGet
      tags: [Admin]
      summary: 原创入门内容的创作过程汇总
      description: '仅管理员可读。基于入门目录对应项目全部未删除创作会话计算，data 包含 started、finished、paused、abandoned、completionRate（无会话为 null）。不包含身份、心理内容或疗效推断。'
      responses:
        '200':
          description: Result.data 汇总对象
        '403':
          description: 无管理员权限，code 1003
