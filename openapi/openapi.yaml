  # ---------- 认证 ----------
  /api/auth/register:
    post:
      operationId: authRegister
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReq' }
      responses:
        '200': { description: 注册结果，code=2002 表示用户名已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/login:
    post:
      operationId: authLogin
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        '200':
          description: '成功返回 token（后续请求以 "Authorization: Bearer <token>" 携带）；失败 code=2001（不区分用户不存在与密码错误；同一账号连续失败 5 次锁定 15 分钟，锁定期间返回同码、提示「尝试次数过多，请稍后再试」，不泄露账号是否存在）'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/me:
    get:
      operationId: authMe
      summary: 当前用户信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/password/forgot:
    post:
      operationId: authPasswordForgot
      summary: 申请密码重置令牌（忘记密码）
      description: '按账号申请一次性重置令牌（30 分钟有效、用后失效，服务端只存令牌哈希）。无论账号是否存在都返回相同文案（code=0），不泄露账号是否存在；发送通道可配置（log=打印到服务端日志，仅供开发）；未配置通道时返回 code=3001「该功能暂未开放」，不静默成功。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordForgotReq' }
      responses:
        '200': { description: 'code=0 已受理（不区分账号是否存在）；code=3001 该功能暂未开放（未配置发送通道）', content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/password/reset:
    post:
      operationId: authPasswordReset
      summary: 用重置令牌设置新密码
      description: '校验一次性重置令牌；成功后旧密码立即失效、该账号登录失败计数与锁定清零。令牌无效、过期或已使用返回 code=3001。已签发的旧 JWT 在其自身有效期内仍有效（JWT 无状态，未做版本吊销），介意时可重新登录以获取新 token。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetReq' }
      responses:
        '200': { description: 'code=0 重置成功；code=3001 重置令牌无效或已过期；code=1003 账号不可用', content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 通知 ----------
  /api/notifications/unread-count:
    get:
      operationId: notificationUnreadCount
      summary: 未读通知数（本人，首页高频轮询点，服务端短 TTL 缓存）
      description: '只统计当前登录用户本人未读（read_flag=0 且未逻辑删除）。服务端按用户做 5 秒短 TTL 进程内缓存以支撑首页轮询；不暴露任何他人维度信息。'
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'code=0；data.unread 为未读数'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unread: { type: integer, format: int64, example: 3 }
        '401': { description: 未登录（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/notifications:
    get:
      operationId: notificationList
      summary: 通知列表（分页 + 按类型/refType 筛选，仅本人）
      description: '按 create_time 倒序返回当前用户本人的通知。type 可选，取值 WORK_AUDIT（作品审核结果）/ COMMENT_AUDIT（评论审核结果）/ BOOKING_REPLY（预约回复）/ GROUP_JOIN（小组新成员动态）/ CARE_REMINDER（关怀跟进提醒，仅授权角色）/ CAMPUS_AUDIT（校园身份核验结果，2026-11-04 AH3，驳回正文含审核理由）。refType 可选（BJ 2026-11-05），在 type 之上按关联对象细分（如 type=WORK_AUDIT&refType=project 只看项目类审核通知），total 与全部筛选条件一致；非法 refType 返回 1001；不传行为与旧版一致。id 以字符串返回（雪花 ID 不得转 Number）。正文为脱敏内容，不含他人隐私。'
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - in: query
          name: type
          schema: { type: string, enum: [WORK_AUDIT, COMMENT_AUDIT, BOOKING_REPLY, GROUP_JOIN, CARE_REMINDER, CAMPUS_AUDIT, SOFT_TIER_NOTICE] }
        - in: query
          name: refType
          schema: { type: string, enum: [work, comment, booking, group, care_reminder, campus_verification, project, inheritor_profile, soft_review] }
          description: 'BJ：按关联对象类型细分（取自事件侧真实写入集合）；空值/不传=不筛选'
      responses:
        '200':
          description: 'code=0；data.records 为通知数组，data.total 为总数'
          content:
            application/json:
              schema:
                allOf:
