  /api/admin/works/{id}/ai-suggest:
    post:
      operationId: adminWorkAiSuggest
      summary: '审核员：作品 AI 辅助建议（按需调用，BL 2026-11-05）'
      description: |
        AI 只给建议不处置：不写审核状态、不触发任何动作，建议仅返回给审核员参考。
        响应固定含 disclaimer（前端必须展示「AI 辅助建议，仅供人工参考，不构成结论」）。
        媒体内容 AI 不可见，只在 riskPoints 提示人工核对，绝不编造媒体描述。
        降级：AI 不可用/熔断/输出未过安全过滤/格式不可用 → code=0 且 data.available=false
        + note 说明（明确状态标识，不是报错也不是"没问题"）。
        频控：每审核员 30 次/小时（超限 1001）。每次调用落 ai_audit_log（scene=moderation，
        携带 refType=work + refId，raw_input/ai_output 加密）。
      x-required-role: admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: '作品 ID（雪花，字符串）' } }
      responses:
        '200': { description: 'Result，data 为建议结构（available/tendency/narrative/riskPoints/uncertainty/note/disclaimer）。tendency 取值：NO_OBVIOUS_ISSUE / HAS_CONCERNS / UNCERTAIN；仅当服务端开启 zhiyu.moderation.soft-tier.enabled（默认关）时可能出现第四值 SOFT_CONCERN（轻微关注：通过但进抽检池+曝光降权，语义见 docs/moderation-soft-tier-20261105.md）。开关开启时响应另带 narrative 单选枚举（self_disclosure=本人体验自述且无风险指代 / risk_action=含风险动作、时间、手段或准备指代 / other_directed=含指向他人的求助、鼓动或引导 / none=以上都不是）；软档窄门：tendency=SOFT_CONCERN 且 narrative=self_disclosure 才成立，缺字段、未知枚举值或取其他值由服务端保守降为 UNCERTAIN。旧前端对未知 tendency 必须按「无法判断」兜底展示，不得显示英文原串' }
        '400': { description: '频控超限（code=1001）' }
