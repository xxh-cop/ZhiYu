  /api/growth/programs/{id}/bookings/{bookingId}/review:
    post:
      operationId: reviewGuidanceBooking
      summary: 主办人确认或拒绝待确认的一对一预约
      description: 一对一新预约为 PENDING，占用名额和日程；确认变为 BOOKED，拒绝变为 REJECTED 并释放名额。已确认的历史预约保持不变。仅开放且未开始的活动允许审核，重复审核返回 3001。
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {in: path, name: bookingId, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [CONFIRM, REJECT]}
      responses:
        '200': {description: 'Result，成功为 0，非法状态为 3001'}
        '400': {description: 参数错误}
        '401': {description: 未登录}
        '403': {description: 非主办人或管理员}
  /api/growth/programs/{id}/lessons:
