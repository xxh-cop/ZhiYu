      description: '对已作答样本计算 Spearman 等级相关：自评分数（1~7 序数量表，配等级相关而非 Pearson）× 会话「专注停留占比」（flow_seconds / 会话时长秒数，仅时长为正的会话）。样本量 < 30 → status=insufficient、rho=null、metricLabel 保守取「专注停留占比」（不假装有结论）；样本充足时 ρ ≥ 0.3 → metricLabel=「心流占时」，ρ < 0.3 → 降级「专注停留占比」。常数序列（无方差）按 ρ=0 保守处理。响应：{ method:"spearman", threshold:0.3, minSamples:30, sampleSize, status:"ok"|"insufficient", rho, metricLabel }。'
      x-required-role: admin
      responses:
