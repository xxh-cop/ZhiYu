      description: '按时间区间返回按资源 key（scene：llm-chat / llm-recommend / llm-message / llm-strong / llm-moderation / llm-summary / llm-rag / llm-lineart / asr / tts；编排层 trace 以业务场景名记录，如 companion）分组的调用量、成功率、降级率、错误率、avg/P50/P95 延迟、tokens 用量与模型标识。数据源为 ai_trace（只追加、脱敏元数据），不含用户标识、会话 ID、prompt 或对话原文；tokens 仅在客户端可获取时记录，未记录的行不参与求和；P50/P95 基于区间内延迟样本（全场景合计上限 20000 条、取最近，latencySampleTruncated 标记是否截断）。聚合计数遵循全局 Long→String 序列化。'
