  # ---------- 情绪 ----------
  /api/dialogue/chat:
    post:
      operationId: dialogueChat
      x-status: 'implemented (gated)'
      summary: '统一对话入口（AA 批 2026-11-04 已实现；2026-11-05 阶段 2 起开关默认开启）'
      description: |
        双对话收敛（dialogue-unification-20261104 §C1）统一入口。**由开关
        `zhiyu.dialogue.commander`（环境变量 ZHIYU_DIALOGUE_COMMANDER）门控，2026-11-05 起默认开启，
        置 false 一键回落（回落时本路径未注册）。**
        关闭时控制器不注册（@ConditionalOnProperty），已认证用户访问按未注册路径返回 1004、
        匿名访问返回 1002；开启时经调度层（入口安检 → 规则路由 → 子能力 → 三道闸）执行。

        请求体：`{ sessionId?, text, entryContext, practiceSessionId?, intentHint? }`
        - entryContext：LISTENING_PAGE / PRACTICE_PAGE / KNOWLEDGE_PAGE（路由规则输入之一）
        - intentHint：前端快捷动作显式意图（如 recommend_craft / breathing），命中规则③
        - practiceSessionId：entryContext=PRACTICE_PAGE 时关联的练习会话

        返回 text/event-stream。P2 实现外发的事件：
        - chunk / revoke：句级流式与安全撤回（语义同 /api/emotion/chat mode=live）；
          陪伴/知识能力的整段回复以单 chunk 下发
        - done：`{ sessionId, capability, crisis, revoked, toolUsed }`（capability 为
          LISTENING / PRACTICE_COMPANION / KNOWLEDGE / CRISIS）
        - error：`{ code, message }`（SSE 故障不使用 HTTP 层错误码，AGENTS §3 注）
        stage / message / tool / citation 富事件在 P2 协议中不外发，仍由
        /api/companion/sessions/{id}/message 与 /api/heritage/** 原端点承载（P3 适配器处理）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                sessionId: { type: string, nullable: true, description: 会话雪花 ID，字符串 }
                text: { type: string, description: 用户输入文本 }
                entryContext: { type: string, enum: [LISTENING_PAGE, PRACTICE_PAGE, KNOWLEDGE_PAGE], default: LISTENING_PAGE }
                practiceSessionId: { type: string, nullable: true, description: 练习会话雪花 ID，字符串 }
                intentHint: { type: string, nullable: true, description: 显式意图提示（快捷动作） }
      responses:
        '200': { description: 'SSE 流（开关开启时；关闭时本路径未注册，走 1004/1002 语义）', content: { text/event-stream: { schema: { type: string } } } }
        '401': { description: 未登录（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 未同意隐私政策（code=1003）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
      deprecated: false

  /api/emotion/chat:
    post:
      operationId: emotionChat
      deprecated: true
      summary: AI 情绪对话（SSE 流式）
      description: |
        **deprecated（2026-11-04 P0 契约登记，双对话收敛 C2）**：本端点进入兼容期，
        内部将转调度层（/api/dialogue/chat，见 C1）作为薄适配器，**协议不变，现有客户端无需改动**；
        删除前至少保留一个迭代周期并配合前端发版。
        AA 批（2026-11-04）：开关 `zhiyu.dialogue.listening-via-commander=true` 时本端点委托调度层执行
        （事件形状不变：live 走 chunk/revoke/done，legacy 走 data/done）；2026-11-05 阶段 2 起默认开启，
        置 false 一键回落原实现（旧实现保留）。

        身份、隐私同意和会话归属校验通过后返回 text/event-stream。
        前置校验失败使用标准 HTTP 错误；开始流后失败使用 error 事件。

        两种协议由请求体 mode 决定：
        - mode=live（句级真流式，推荐）：模型输出按句切分（。！？；换行，首句 40 字、单句 80 字强制切段），
          每句通过句级安全检查后立即推送；全文终检命中时撤回已推内容并整体替换。
          事件：
          - chunk: { "text": "我在这里陪着你。" }
          - revoke: { "text": "安全替换文本", "reason": "safety" }（仅终检/句级命中时出现，整体替换最后一条回复）
          - done: { "sessionId": 123, "crisis": false, "revoked": false }
          - error: { "code": 5000, "message": "服务暂时不可用" }
          句级命中高危：立即中断生成，revoke 为关怀话术，done 的 crisis=true；危机干预与审计照常触发。
          输入侧命中高危时不调模型，直接以 chunk（关怀话术）+ done(crisis=true) 结束。
        - 缺省（旧版整段，兼容期一个迭代周期）：安全检查完成后以单个 data 事件下发全文，
          再发 done: { "sessionId": 123, "crisis": false }。旧前端无需改动，但应按 live 协议升级。
        幂等：客户端断线重发同一 content 时，若会话末条用户消息相同则不重复落库。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatReq' }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

