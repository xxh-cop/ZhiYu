    get:
      operationId: craftStarterGet
      tags: [Craft]
      summary: 已上架的原创入门练习与材料准备说明
      description: '仅返回资源目录中且数据库已上架未删除的项目；id 为字符串，含 title、minutes、medium、tools、places、materials（name、qty、substitute）、steps（title、guide、rescue、diagram）、source（label、url）、authorship。时间是编辑估计，不作疗效承诺。'
      responses:
        '200':
          description: Result.data 为练习数组；未导入内容时返回空数组
        '401':
          description: 未登录，code 1002
        '403':
          description: 账号不可用，code 1003
  /api/craft/session/active:
    get:
      operationId: craftSessionActiveGet
      tags: [Craft]
      summary: 本人可继续的创作会话
      description: 仅返回本人进行中或暂停且项目仍上架的最近 20 条；不包含情绪会话或心理记录。
      parameters:
        - in: query
          name: projectId
          schema:
            type: integer
            format: int64
          description: 可选，限定一个项目，避免恢复入口受全局最近 20 条限制
      responses:
        '200':
          description: Result.data 数组，字段 sessionId、projectId（字符串）、projectTitle、currentStep、totalSteps、status
        '401':
          description: 未登录，code 1002
        '403':
          description: 账号不可用，code 1003
