      summary: '管理员：登记一次数据导出（留痕，返回导出批次号）'
      description: '导出审计（2026-11-04，docs/export-audit-20261104.md）：前端在生成导出文件前调用本接口登记「谁、何时、何筛选、多少条、导出什么字段、用途」，服务端返回 batchNo（雪花，字符串）与建议文件名（含批次，替代不可行的 CSV 水印）。targetType=users/works 开放登记；targetType=comments 当前不开放（返回 3001「评论导出暂未开放」），开放条件见设计文档权限矩阵。单次导出 recordCount 超过阈值（默认 5000）时 alert=true 并记 WARN 日志（批量告警）。'
      x-required-role: admin-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, fieldList, recordCount, purpose]
