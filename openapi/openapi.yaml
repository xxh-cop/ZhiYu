      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 'Result，data 含 session、messages'}
    delete:
      operationId: emotionSessionsByIdDelete
      summary: 删除本人会话及消息，保留独立安全审计
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 'Result'}
  /api/emotion/sessions/{id}/summary:
    get:
      operationId: listeningSummaryGet
      summary: 读取本人已保存的倾听小结
      description: '只返回本人记录；不返回其他会话或管理员关怀视图。未保存时 data.saved=false。'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Result.data 为 ListeningSummaryVO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListeningSummaryVO' }
        '401': {description: 未登录（code=1002）}
        '404': {description: 会话不存在或不属于本人（code=1004）}
    put:
      operationId: listeningSummarySave
      summary: 保存本人倾听小结
      description: '只允许保存已结束会话的小结；文本 1..300 字，显式同意后加密写入 wellbeing_record 的 LISTENING_SUMMARY。包含安全信号的会话拒绝保存。'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary, consent]
              properties:
                summary: {type: string, minLength: 1, maxLength: 300}
                generated: {type: boolean, default: false}
                consent: {type: boolean, description: '必须为 true'}
      responses:
        '200':
          description: Result.data 为保存后的 ListeningSummaryVO
        '400': {description: 参数校验失败或未授权（code=1001）}
        '409':
          description: '状态不允许（HTTP 200 + code=3001），会话未结束或包含安全信号'
    delete:
      operationId: listeningSummaryDelete
      summary: 删除本人倾听小结
      description: 只逻辑删除 LISTENING_SUMMARY 记录，不删除倾听会话与消息。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 'Result'}
        '404': {description: 会话不存在或不属于本人（code=1004）}
  /api/emotion/sessions/{id}/summary/generate:
    post:
      operationId: listeningSummaryGenerate
      summary: 生成本人已结束会话的倾听小结
      description: '只读取本人已结束会话中的用户发言，最多 12 段；不读取 AI 回复或其他会话。生成不落库；AI 失败返回固定记录引导，高危会话返回 safetyHold=true 且不生成。'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: {type: boolean, description: '必须为 true'}
      responses:
        '200':
          description: Result.data 为 {summary, generated, safetyHold}，不写 wellbeing_record
        '400': {description: 未同意授权（code=1001）}
        '409':
          description: '会话未结束（HTTP 200 + code=3001）'
  /api/admin/operation-logs:
    get:
      operationId: adminOperationLogsGet
      summary: 管理员分页查看操作元数据，不记录请求体与敏感信息
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: 'Result，data 含 records、total'}
  /api/files/upload/video:
    post:
      operationId: filesUploadVideoPost
      summary: 上传 MP4 视频到私有本地存储
      description: '已登录且启用的用户；最大 50MB；每日最多 20 次；返回稳定引用。社区视频新发布为待审，传承人视频随项目审核。'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {description: 'Result 包装，data.url 为 /api/media/{id}/content 稳定引用，不是公开文件地址'}
        '400': {description: 文件扩展名、大小、MP4 文件头或配额不符合要求}
        '401': {description: 未登录}
  /api/files/upload/audio:
    post:
      operationId: filesUploadAudioPost
      summary: 上传步骤引导音频到私有存储（仅传承人/管理员）
      description: |
        AU3（2026-11-04）。仅 role ∈ {1,3}；学生是播放受众而非上传者。
        魔数嗅探（不认扩展名）：MP3（ID3/帧同步）/WAV（RIFF+WAVE）/M4A（ftyp）/OGG（OggS）；
        单文件 ≤10MB；每日最多 20 次。返回 `/api/media/{id}/content` 稳定引用，
        供 craft_step.audio_url 使用；学生侧经授权播放（签名地址）收听。
        失败语义：落库失败自动清理已写对象，不留半成品，客户端可直接重试。
        参数/权限错误经 GlobalExceptionHandler，HTTP 400（1001）/403（1003）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Result 包装，data.url 为 /api/media/{id}/content 稳定引用' }
        '400': { description: '内容嗅探不通过、超大小或超配额（code=1001）' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: '学生角色不可上传（code=1003）', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
  /api/files/upload/image:
    post:
      operationId: filesUploadImagePost
      summary: 上传 JPG/PNG/WebP 图片到本地公开目录
      description: |
        已登录用户可用；multipart 字段名固定为 file；允许 jpg/jpeg/png/webp，
        单文件不超过 5MB（按扩展名判断，不校验真实文件头）。
        成功时返回 `/uploads/images/yyyy/MM/dd/{uuid}.{ext}`，由 `/uploads/**` 静态放行，
        不写入 media_asset，也不生成限时签名。
        因此该接口只适用于公开图片；作品等私有内容必须使用
        `POST /api/files/upload/private-image`，不要用本接口的 URL 承载私密图片。

        注意：本接口的参数错误（空文件、超过 5MB、扩展名不支持）与保存失败
        都以 HTTP 200 返回，业务结果看 body.code（1001 / 5000），不是 HTTP 400/500。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
