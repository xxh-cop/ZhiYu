  /api/admin/projects/{id}/takedown:
    put:
      operationId: adminProjectTakedown
      summary: '管理员：下架已上架的手作项目（AY1 2026-11-05；分层下架 2026-11-05）'
      description: |
        状态机：status=1（上架）→ 2（下架，带 kind）→ 3（归档，到期由归档 Worker 执行）；
        2/3 不可回 1（恢复上线走新建送审），审核接口只受理 status=0。
        两类下架（kind 必填）：
        - compliance 合规下架：公开面即收；进行中/暂停会话转只读（可回看、不可推进步骤），
          export_until = 下架时刻 + zhiyu.takedown.compliance.export-window-hours（默认 72h）
          内可导出；窗口结束转归档。不得提供 archiveAt。
        - operational 运营下架：挡新建；存量会话不受影响，可运行到 archiveAt（必填，
          距现在至少 7 天；管理端按 zhiyu.takedown.operational.default-deadline-days=14 预填）；
          到期未完成会话转只读并归档。
        理由必填（≤300 字），落 craft_project.audit_reason，随 WORK_AUDIT 通知
        （refType=project）送达传承人（理由只发传承人，学生端提示语不带指向性措辞）；
        操作落 admin_operation_log（project.takedown）。
        下架后项目详情/新建会话仍 1004（不泄露存在性），步骤音频等私有媒体授权即时失效；
        GET /api/craft/projects/{id}/steps 返回结构化只读视图（见该端点说明）。
      x-required-role: admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: '项目 ID（雪花，字符串）' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, kind]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300, description: 下架理由（必填，通知传承人） }
                kind: { type: string, enum: [compliance, operational], description: '下架类型：compliance 合规 / operational 运营' }
                archiveAt: { type: string, format: date-time, nullable: true, description: '归档截止时间（ISO-8601）；operational 必填且距现在至少 7 天，compliance 不得提供' }
      responses:
        '200': { description: 'Result；非法状态流转时 HTTP 仍为 200、body code=3001（仅上架中项目可下架）' }
        '400': { description: '理由缺失或超长 / kind 缺失或非法 / operational 未填 archiveAt 或距现在不足 7 天 / compliance 提供了 archiveAt（code=1001）' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 无权限（code=1003）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 项目不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

