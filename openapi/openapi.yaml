                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            qty: { type: string }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004，项目不存在或未上架）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 用户隐私合规（M3-B1） ----------
  /api/admin/project-catalog:
    get:
      operationId: adminProjectCatalogGet
      summary: 管理员按上架状态和分类分页查看项目
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 2, default: 0 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: 'records与total；每项含字符串id、title、category、status、level、estMinutes、videoUrl、createTime，不包含用户私人数据' }
  /api/admin/config/runtime:
    get:
      operationId: adminConfigRuntimeGet
      summary: 管理员读取推荐、模型参数和提示扩展配置
      responses:
        '200': { description: 固定配置键、当前值与修订号，不含任何密钥 }
    put:
      operationId: adminConfigRuntimePut
      summary: 管理员以修订号更新运行配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, revision, value]
              properties:
                key: { type: string, enum: [recommendation, model, prompts] }
                revision: { type: integer, minimum: 0 }
                value: { type: object, additionalProperties: true }
      responses:
        '200': { description: 保存成功或3001修订冲突；安全系统提示不可更改 }
  /api/emotion/sessions/{id}/state:
    put:
      operationId: emotionSessionsByIdStatePut
      summary: 本人恢复或结束情绪会话
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [RESUME, END] }
      responses:
        '200': { description: 返回会话；结束时保留已过滤回复摘要，不生成诊断性结论 }
  /api/files/upload/private-image:
    post:
      operationId: filesUploadPrivateImagePost
      summary: 上传受权限保护的作品图片
      description: JPG/PNG/WebP，不超过5MB，返回受保护媒体引用；仅本人或作品授权观众可以读取。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Result包装的媒体引用 }
  /api/media/mine:
    get:
      operationId: mediaMineGet
      summary: 分页查看本人上传的媒体
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: 最新50项，包含id、size_bytes、create_time、kind；不含存储路径 }
  /api/growth/hosts:
    get:
      operationId: growthHostsGet
      tags: [成长与活动]
      summary: 带领者选择协作者
      description: 仅当前有效带领者或管理员可用，仅返回可协作账号编号和昵称。
      responses:
        '200': { description: 有效传承人与咨询师列表 }
  /api/growth/programs/{id}/collaborators:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: growthProgramsByIdCollaboratorsGet
      tags: [成长与活动]
      summary: 查看活动协作者
      responses:
        '200': { description: 仅主办人、协作者或管理员可查看 }
    put:
      operationId: growthProgramsByIdCollaboratorsPut
      tags: [成长与活动]
      summary: 主办人设置协作者
      description: 主办人或管理员设置，最多五名有效带领者。一对一预约不允许协作者。协作者可维护活动课节和签到，不可转授权限或读取私密交流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, maxItems: 5, uniqueItems: true, items: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200': { description: 权限已更新 }
  /api/growth/conversations:
    get:
      operationId: growthConversationsGet
      tags: [成长与活动]
      summary: 本人一对一预约交流入口
      description: 仅预约本人或主办人，管理员无额外阅读权。取消后保留历史只读入口。
      responses:
        '200': { description: 最近200项预约及交流授权状态 }
  /api/growth/bookings/{id}/conversation:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: growthBookingsByIdConversationPut
      tags: [成长与活动]
      summary: 预约用户单独开启或撤回私密交流授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200': { description: 授权已更新，撤回后双方不能发送但本人可保存历史 }
  /api/growth/bookings/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: growthBookingsByIdMessagesGet
      tags: [成长与活动]
      summary: 参与双方查看加密交流历史
      parameters:
        - { in: query, name: before, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: 最新50条，按编号倒序，服务端解密，不缓存 }
    post:
      operationId: growthBookingsByIdMessagesPost
      tags: [成长与活动]
      summary: 发送预约私密消息
      description: 需有效已确认预约、双方有效账号及用户单独授权；仅发送人当前隐私同意有效时可写入，安全过滤后加密保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties: { content: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        '200': { description: 已发送 }
  /api/growth/bookings/{id}/messages/{messageId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      - { in: path, name: messageId, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: growthBookingsByIdMessagesByMessageIdDelete
      tags: [成长与活动]
      summary: 撤回本人发送的预约消息
      responses:
        '200': { description: 清除正文并逻辑删除 }
  /api/groups/{id}/companions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: groupsByIdCompanionsGet
      tags: [互助小组]
      summary: 查看本人与组内成员的结伴邀请
      responses:
        '200': { description: 仅返回涉及本人的邀请，不共享任何情绪记录 }
    post:
      operationId: groupsByIdCompanionsPost
      tags: [互助小组]
      summary: 向同组有效成员发起结伴邀请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties: { memberId: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200': { description: 待对方确认；重复邀请不重复创建 }
  /api/groups/{id}/companions/{invitationId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      - { in: path, name: invitationId, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: groupsByIdCompanionsByInvitationIdPut
      tags: [互助小组]
      summary: 接受拒绝或取消结伴
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties: { action: { type: string, enum: [ACCEPT, DECLINE, CANCEL] } }
      responses:
        '200': { description: 状态更新；仅收件人可接受/拒绝，参与者可取消 }
  /api/groups/{id}/works:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: groupsByIdWorksGet
      tags: [互助小组]
      summary: 当前成员查看小组作品
      parameters:
        - { in: query, name: before, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: 最新20项已审核作品；退出后立即失去作品和视频访问权限 }
  /api/user/data-export:
    get:
      operationId: userDataExportGet
      tags: [用户隐私]
      summary: 分批导出本人记录
      description: 仅当前有效账号本人可用，撤回隐私授权后仍可导出。每批最多100条，按ID升序；不含已删除记录、媒体文件或地址、密码或审计日志。这不是全库快照，记录变更后可从头重新导出。作品含本人私密及待审作品的文字与状态，不含他人评论；预约含本人报名状态与仍可用的活动基本信息，不含主办人身份或其他参与人；校园核验含本人姓名学号和审核结果，不含审核人编号。敏感内容由服务端解密，响应禁止缓存。
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [profile, notes, sessions, messages, records, works, bookings, campus, crafts, lessons, memberships, group-messages, guidance-messages, comments, favorites, media]
        - in: query
          name: after
          schema:
            type: string
            pattern: '^[0-9]+$'
            default: '0'
      responses:
        '200':
          description: 本批数据与下一批游标；nextCursor为空表示该类别导出结束
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      version: { type: integer }
                      category: { type: string }
                      exportedAt: { type: string }
                      rows:
                        type: array
                        items: { type: object, additionalProperties: true }
                      hasMore: { type: boolean }
                      nextCursor: { type: string, nullable: true }
        '400': { description: 不支持的类别或无效游标 }
        '401': { description: 未登录或账号已注销 }
  /api/user/privacy/status:
    get:
      operationId: userPrivacyStatus
      summary: 查询当前用户的隐私政策状态
      description: '返回 privacyAgreed 与 canContact 两个字段'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 隐私状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrivacyStatusVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/privacy/agree:
    post:
      operationId: userPrivacyAgree
      summary: 同意隐私政策
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 同意成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/privacy/withdraw:
    post:
      operationId: userPrivacyWithdraw
      summary: 撤回隐私政策同意（同时取消可联系）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 撤回成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/can-contact:
    put:
      operationId: userCanContactUpdate
      summary: 更新可联系状态（仅本人可调）
      description: '设为 1 时需已同意隐私政策，否则返回 1001'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanContactReq' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001，未同意隐私政策）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/delete:
    post:
      operationId: userDelete
      summary: 注销账号（匿名化 + 逻辑删除）
      description: '需 confirm=true 二次确认；匿名化敏感字段后逻辑删除，不物理删除'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountReq' }
      responses:
        '200': { description: 注销成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001，confirm 非 true）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/profile:
    put:
      operationId: userProfileUpdate
      summary: 更新个人资料（昵称、头像、学校、简介）
      description: '只更新非 null 字段。需认证。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdateReq' }
      responses:
        '200':
          description: 更新成功，返回最新用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/password:
    put:
      operationId: userPasswordUpdate
      summary: 修改密码
      description: '校验旧密码后更新为新密码。JWT 无状态，修改后当前 token 仍有效。旧密码不匹配返回 2001。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeReq' }
      responses:
        '200':
          description: '成功（code=0）；旧密码错误时 code=2001'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '400': { description: 参数校验失败（code=1001，新密码长度不合规）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/stats:
    get:
      operationId: userStats
      summary: 学生端「我的」统计数据
      description: '返回注册天数、作品数、便签数'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserStatsVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 心理援助热线（M3-B1，公开接口） ----------
  /api/crisis/hotlines:
    get:
      operationId: crisisHotlines
      summary: 获取心理援助热线信息
      description: '公开接口，未登录也能访问，用于登录页与危机干预页展示'
      security: []
      responses:
        '200':
          description: 热线信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HotlinesVO' }

  # ---------- AI RAG 问答（M3-3） ----------
  /api/ai/rag/ask:
    post:
      operationId: aiRagAsk
      summary: 非遗知识库问答
      description: '基于 RAG（检索增强生成）的非遗知识问答，学生输入问题，系统从非遗知识库检索相关内容后由 AI 生成回答'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagAskReq' }
      responses:
        '200':
          description: 问答结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RagAnswerVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

    InheritorProfileSelfVO:
      type: object
      description: 传承人自己的资料返回体
      properties:
        id: { type: integer, format: int64, description: inheritor_profile 主键 }
        userId: { type: integer, format: int64, description: 关联用户 ID }
        skill: { type: string, description: 擅长技艺 }
        intro: { type: string, description: 个人简介 }
        honor: { type: string, description: 荣誉头衔 }
        verified: { type: integer, description: '0 未认证 / 1 已认证' }
        avatarUrl: { type: string, description: '头像 URL（来自 user 表）' }

    InheritorProfileSelfUpdateReq:
      type: object
      description: 传承人自更新资料请求体（所有字段可选，null 表示不更新）
      properties:
        skill: { type: string, maxLength: 100, description: 擅长技艺 }
        intro: { type: string, maxLength: 500, description: 个人简介 }
        honor: { type: string, maxLength: 255, description: 荣誉头衔 }
        avatarUrl: { type: string, maxLength: 255, description: '头像 URL，非空时同步更新 user.avatar_url' }

    UserStatsVO:
      type: object
      description: 学生端「我的」统计数据
      properties:
        daysSinceRegister: { type: integer, format: int64, description: '注册天数（今天注册返回 1）' }
        workCount: { type: integer, format: int64, description: '作品数' }
        noteCount: { type: integer, format: int64, description: '便签数' }

    RagAskReq:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500, description: '用户问题' }

    RagAnswerVO:
      type: object
      description: RAG 问答返回体
      properties:
        answer: { type: string, description: 'AI 生成的回答文本' }
        sources:
          type: array
          description: 引用的知识库来源列表
          items: { $ref: '#/components/schemas/RagSourceVO' }

    RagSourceVO:
      type: object
      description: RAG 引用来源
      properties:
        title: { type: string, description: '来源文件名' }
        excerpt: { type: string, description: '内容摘要（前 80 字）' }
