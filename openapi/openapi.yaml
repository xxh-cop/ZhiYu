  /api/admin/flow-metrics/dashboard:
    get:
      operationId: adminFlowMetricsDashboard
      summary: '管理员：心流/专注度量看板聚合（阶段 1-2，2026-11-05）'
      description: >-
        口径以 docs/flow-metrics-dashboard-literature-20261105.md §3/§9 为准，不另行发明。
        分母=会话各步骤 step_leave.dwell_seconds 之和（活跃创作时长），分子=flow_seconds
        （2026-11-05 起为「阈值后深度沉浸秒数」，此前存量每达标片段约多记 300s，前后结构性不可比）。
        会话级占比=分子/分母；看板指标=人×周会话占比中位数（会话按 start_time 归周，Asia/Shanghai，
        周一为周起点），报 p50/p90 与分桶样本数，不给单一均值大数字。
        仅终态会话（status 3 完成 / 4 放弃）进入分布；在途会话与无 step_leave 事件的会话
        （活跃时长不可得）只在 totals 计数返回，不参与占比。
        剔除（分子分母同口径、会话级；判定优先级 readOnly 标志 → projectStatus+takedown_kind →
        事件流证据：精确档 step_gate_blocked（心跳被下架闸口拒绝的真实时点），
        兜底档 session_archive（归档 Worker 派生，仅会话无 gate 事件时使用））：项目当前只读
        （合规下架窗口内 / 已归档 / 运营下架已到期，
        与 TakedownStateResolver 同口径）且会话最后活动时间不早于只读起点 → 整会话剔除；
        待审项目（status=0）会话同样剔除（多为测试/演示数据，不混入分布，§9.3）；
        剔除条数与明细在 exclusions 返回，不悄悄剔；明细含 readOnlySince 与
        readOnlyEvidence（project_state=项目当前状态推导 / step_gate_blocked=精确档 /
        session_archive=兜底档）。
        运营下架未到期会话计入，但按 takedown_kind=operational 在 facets.byTakedownKind 单独分面，
        不与常态并线（§9.2）。
        分层：facets.byLevel（craft_project.level；项目缺失归 unknown，如实显示「未分层」）与
        facets.byDurationBucket（按会话活跃时长 <5 / 5-15 / 15-30 / >30 分钟入桶）；
        单元去重用户数 <10 → sparse=true（前端标灰）。
        自评校准：calibration 与 /api/admin/flow-calibration/stats 同口径
        （metricLabel 由效度决定，insufficient 或 ρ<0.3 时为「专注停留占比」，不得写「心流占时」）；
        selfReport 按 wellbeing_record(kind=FLOW_CAL) 的 create_time 落区间统计
        sampled/answered/skipped/noResponse/responseRate（区分「没看到」与「看到不答」）。
        definitionChanges 列出 2026-11-05 三处口径变更（归档态与 takedown_kind / 只读会话进入数据面并剔除 /
        flow_seconds 语义变更），变更点前后数据不得跨期比较；unavailable[] 如实列出不可得指标
        （自评相关系数样本不足、导出成功率、通知触达回执回流、音频被动段剔除、practice 专注时长），
        不以 0 填充冒充有数据。
