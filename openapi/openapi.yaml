openapi: 3.0.3
info:
  title: 织愈 API
  version: 1.0.0
  description: |
    「织愈」后端接口契约。统一响应体：
    `{ code: 0, message: "操作成功", data: {} }`
    错误码见 AGENTS.md §3。对话接口使用 SSE（text/event-stream）。

    约定：
    - 除 SSE 接口外，所有接口的响应 body 统一包 Result。
    - SSE 接口（/api/emotion/chat）不使用 HTTP 层错误码，失败通过 `event: error` 推送，由前端降级。
servers:
  - url: http://localhost:8080
    description: 本地开发

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Result:
      type: object
      properties:
        code: { type: integer, default: 0, example: 0 }
        message: { type: string, default: 操作成功, example: 操作成功 }
        data: { description: 业务数据，结构随接口而定（对象/数组/标量均可） }

    ErrorResult:
      description: >-
        错误响应体，用于 401（未认证，code=1002）与 403（权限不足，code=1003）。
        这两种响应由 Spring Security 过滤器链在 DispatcherServlet 之前直接写出，
        不经过 GlobalExceptionHandler，但响应体格式与 Result 完全一致，且不是空体。
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            code: { type: integer, example: 1002 }
            data: { type: object, nullable: true, description: 错误响应不携带业务数据，固定为 null }

    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: student01 }
        password: { type: string, format: password }

    RegisterReq:
      type: object
      required: [username, password, nickname]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        nickname: { type: string }
        school: { type: string, maxLength: 100, nullable: true, description: 所在学校，可选 }

    LoginVO:
      type: object
      description: 登录成功返回体
      properties:
        token: { type: string, description: JWT }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        role: { type: integer, description: 角色码，取值见 AGENTS.md §3.1（0学生 1传承人 2咨询师 3管理员） }

    UserVO:
      type: object
      description: 当前用户信息，不含密码
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, description: 登录名（学号或昵称） }
        nickname: { type: string }
        school: { type: string, nullable: true }
        role: { type: integer, description: 角色码，取值见 AGENTS.md §3.1（0学生 1传承人 2咨询师 3管理员） }

    ChatReq:
      type: object
      required: [content]
      properties:
        sessionId: { type: integer, nullable: true }
        mood: { type: string, nullable: true }
        content: { type: string, example: 今天考试周压力很大 }

    NoteReq:
      type: object
      required: [content]
      properties:
        content: { type: string }
        mood: { type: string, nullable: true }

    HeartbeatReq:
      type: object
      description: |
        步骤心跳：只上报步骤推进与心流信号，不修改会话主状态机。
        主状态机流转请使用 PUT /api/craft/session/{id}/status。
      required: [stepNo, dwellSeconds]
      properties:
        stepNo: { type: integer, description: 当前步骤序号 }
        dwellSeconds: { type: integer, description: 在本步骤停留秒数 }
        isExited: { type: boolean, description: 是否主动退出 }
        isBreathingResponded: { type: boolean, description: 是否响应了呼吸提醒 }

    HeartbeatResult:
      description: 心跳响应，统一包 Result，data 为心流判定信号
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                inFlow: { type: boolean, description: 是否处于心流状态（连续 5 分钟无步骤切换且未主动退出） }
                needBreathing: { type: boolean, description: 是否需要呼吸引导（焦躁：同一步骤反复停留>3 次且未响应呼吸提醒） }

    LikeResult:
      description: 点赞/收藏 toggle 结果，统一包 Result，data.active 表示本次请求后的状态
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                active: { type: boolean, description: true=已点赞/已收藏；false=本次请求执行了取消 }

    WorkPublishReq:
      type: object
      required: [title]
      properties:
        sessionId: { type: integer, nullable: true }
        title: { type: string }
        message: { type: string, nullable: true, description: AI 寄语，可由系统生成 }
        visible: { type: integer, enum: [0, 1, 2], description: 0私密 1公开 2仅小组, default: 1 }
        anonymous:
          type: boolean
          default: true
          description: 后端仍存 user_id，anonymous 仅控制展示层；true 时展示为「匿名同学」。与 visible 正交共存。

    CraftStepVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepNo: { type: integer, description: 步骤序号 }
        title: { type: string, description: 步骤标题 }
        guide: { type: string, description: 引导语 }
        audioUrl: { type: string, nullable: true, description: 引导语音频 URL }

    CraftProject:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        intro: { type: string }
        cultureBg: { type: string }
        level: { type: integer, description: 1入门 2进阶 3高阶 }
        estMinutes: { type: integer }
        category: { type: string, description: 技艺品类，取值见 dict_category.label }
        therapyTags: { type: array, items: { type: string }, description: 疗愈效果标签，词表见 dict_therapy_tags }

    CommentReq:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 255 }

    WorkVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        coverUrl: { type: string, nullable: true }
        message: { type: string, nullable: true }
        authorName: { type: string, description: 匿名时为"匿名同学" }
        anonymous: { type: boolean }
        visible: { type: integer, enum: [0, 1, 2] }
        likeCount: { type: integer }
        commentCount: { type: integer }
        createTime: { type: string, format: date-time }

    WorkPageVO:
      type: object
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/WorkVO' }

    CommentVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        content: { type: string }
        authorName: { type: string }
        createTime: { type: string, format: date-time }

    CommentPageVO:
      type: object
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        records:
          type: array
          items: { $ref: '#/components/schemas/CommentVO' }

    LikeVO:
      type: object
      properties:
        active: { type: boolean, description: 本次请求后是否处于已点赞/已收藏状态 }

    GroupCreateReq:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        maxCount: { type: integer, minimum: 1, maximum: 500, default: 50 }

    GroupVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        maxCount: { type: integer }
        memberCount: { type: integer }
        status: { type: integer, enum: [0, 1] }
        joined: { type: boolean, description: 当前用户是否已加入 }
        myRole: { type: string, nullable: true, description: 成员/组长/null（未加入） }

    RecommendItemVO:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        title: { type: string }
        intro: { type: string }
        cultureBg: { type: string }
        level: { type: integer }
        estMinutes: { type: integer }
        therapyTags: { type: string }
        coverUrl: { type: string, nullable: true }
        score: { type: number, format: double }
        reason: { type: string }

    RecommendVO:
      type: object
      properties:
        recommendationId: { type: integer, format: int64 }
        mood: { type: string }
        reason: { type: string, description: 整体推荐理由 }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecommendItemVO' }

    CreateSessionDTO:
      type: object
      required: [projectId]
      properties:
        projectId: { type: integer, format: int64, description: 手作项目 ID }

    SessionStatusDTO:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, finish, abandon], description: '无 start；创建即为进行中' }

    CraftSessionVO:
      type: object
      properties:
        sessionId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        projectTitle: { type: string, description: 项目标题（join craft_project 取） }
        status: { type: integer, description: '0待开始 1进行中 2已暂停 3已完成 4已放弃' }
        statusLabel: { type: string, description: '状态中文标签' }
        currentStep: { type: integer }
        totalSteps: { type: integer, description: '项目总步骤数（count craft_step）' }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }

paths:
  # ---------- 认证 ----------
  /api/auth/register:
    post:
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReq' }
      responses:
        '200': { description: 注册结果，code=2002 表示用户名已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/login:
    post:
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        '200':
          description: '成功返回 token（后续请求以 "Authorization: Bearer <token>" 携带）；失败 code=2001'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/auth/me:
    get:
      summary: 当前用户信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 情绪 ----------
  /api/emotion/sessions:
    get:
      summary: 当前用户会话历史列表
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/emotion/chat:
    post:
      summary: AI 情绪对话（SSE 流式）
      description: |
        返回 Content-Type: text/event-stream，HTTP 状态码恒为 200。
        事件：
        - message: { "delta": "你好" }
        - done: { "sessionId": 123 }
        - error: 失败（熔断/超时），不使用 HTTP 层错误码，前端降级为缓存图文陪伴话术
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatReq' }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/emotion/note:
    post:
      summary: 记录心情便签（加密存储）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteReq' }
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 手作 ----------
  /api/craft/projects:
    get:
      summary: 手作项目列表（已上架）
      parameters:
        - { name: tag, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer }, description: 页码，从 1 开始 }
        - { name: size, in: query, schema: { type: integer }, description: 每页条数，默认 10 }
      responses:
        '200':
          description: 分页项目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CraftProject' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/projects/{id}/steps:
    get:
      summary: 项目步骤详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 步骤列表（按 stepNo 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CraftStepVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 无权限（code=1003）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/recommend:
    get:
      summary: 根据当前心情推荐手作
      parameters:
        - { name: sessionId, in: query, schema: { type: integer } }
        - { name: skillLevel, in: query, required: false, schema: { type: integer, default: 1, minimum: 1, maximum: 3 } }
        - { name: minutes, in: query, required: false, schema: { type: integer, default: 60, minimum: 10 } }
      responses:
        '200':
          description: 推荐项目列表 + 个性化理由
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecommendVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/session:
    post:
      summary: 创建会话，状态直接为进行中
      description: |
        创建后 craft_session.status 直接为 1（进行中），不存在「待开始」中间态。
        状态机只有 pause / resume / finish / abandon 四个流转动作，没有 start。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionDTO' }
      responses:
        '200':
          description: 会话信息（status=1 进行中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CraftSessionVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 无权限（code=1003）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/session/{id}:
    get:
      summary: 查询创作会话进度
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 会话状态、当前步骤、心流时长（flow_seconds，占比 = flow_seconds/(end_time-start_time)）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CraftSessionVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 无权限（code=1003）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/session/{id}/status:
    put:
      summary: 推进创作会话状态机
      parameters:
