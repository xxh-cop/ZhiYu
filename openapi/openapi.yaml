  /api/craft/session/{id}/events:
    post:
      operationId: craftSessionEventsIngest
      summary: 批量上报创作会话行为事件（幂等，2026-11-05 心流度量配套）
      description: '客户端上报生命周期（visibility_change / app_lifecycle）、音频播放（audio_play）、步骤进入/离开（step_enter / step_leave）等行为信号，作为心流沉浸与疑似离席判定的数据源。幂等：同一 (session_id, client_seq) 重复上报计 deduped 不重复入库；仅白名单事件类型可上报，dwell_stagnation / suspected_away / breathing_prompt / session_finish / session_abandon / session_archive / step_gate_blocked / stuck_guide_shown 等服务端派生类型一律 1001（step_gate_blocked 为心跳被下架闸口拒绝的服务端证据事件，客户端不可伪造；stuck_guide_shown 为卡点引导触点的频率计数证据）。context 只允许脱敏标量键值（数字/布尔/≤64 字符字符串），禁止对话或自由文本。会话进行中（DOING）或已暂停（PAUSED）可上报，其余状态 3001。'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionEventBatchReq' }
      responses:
        '200':
          description: '受理结果计数，形如 { code: 0, data: { accepted: 2, deduped: 1, failed: 0 } }；deduped 为重复 client_seq 去重条数（幂等，不算错误），failed 为时钟超前等不可接受条数'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEventBatchResult' }
        '400': { description: 参数校验失败（code=1001；含未知/服务端派生事件类型、context 非标量、批次超 100 条）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: 无权限（code=1003，非会话归属者）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/session/{id}/export:
    get:
      operationId: craftSessionExport
      summary: 导出本人在合规下架窗口内的创作会话数据（2026-11-05 下架窗口导出）
      description: '仅项目处于合规下架导出窗口（status=2 且 takedown_kind=compliance 且当前时刻 ≤ export_until）且 zhiyu.takedown.export-enabled=true 时可导出；窗口过期、项目不在窗口内、归档态或导出开关关闭一律 HTTP 200 + code=3001 并给可读原因（不用 1004 伪装「不存在」）。范围严格限定本人会话产物：会话起止/时长/当前步骤/心流快照（flowSeconds）、已发生的行为事件（列口径同 data-export 的 craft-events 类别）、该会话产出的作品标识（id/title/mediaType/时间，不含媒体内容）；不导出他人内容、不导出平台步骤内容。响应为附件下载：Content-Disposition: attachment，文件名 zhiyu-craft-session-{sessionId}-p{projectId}.json，Content-Type: application/json;charset=UTF-8，Cache-Control: no-store。成功导出后写入 craft_session_event 的 export 事件（不静默）。'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: '会话 ID（雪花，字符串）' } }
      responses:
        '200':
          description: '成功时为附件（application/json;charset=UTF-8），body 为导出 JSON：version/exportedAt/exportUntil/project{id,title}/session{...}/events[]/works[]；业务拒绝（code=3001 窗口过期或不在窗口、1003 非本人）时 body 为 Result JSON 而非附件'
          content:
            application/json:
              schema:
                type: object
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: '非会话归属者（code=1003；与既有会话端点口径一致）', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 会话不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/session/{id}/calibration:
    get:
      operationId: craftSessionCalibrationGet
      summary: 查询心流自评校准状态（阶段 1-1，2026-11-05）
      description: '会话 finish 时按 zhiyu.flow.calibration.sample-rate（默认 0.2）抽样并落库（wellbeing_record，kind=FLOW_CAL，record_key=会话 ID），抽样结论稳定可追溯：同一会话重复查询得到同一结论。sampled=false 时前端不弹窗（此时无 question/scale 字段）；sampled=true 时返回 question 与 scale。量表选 1~7 七点李克特（比 1~5 分辨率高、比 0~10 负担小，序数口径与 Spearman 相关配套）。'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: '会话 ID（雪花，字符串）' } }
      responses:
        '200':
          description: '校准状态：{ sampled, answered, skipped, score, question?, scale? }。sampled=true 时 scale={ min:1, max:7, minLabel:"完全没投入", maxLabel:"完全沉浸其中" }，question="刚才这段创作时间里，你的专注与沉浸程度如何？"；score 仅 answered=true 时有值'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sampled: { type: boolean }
                          answered: { type: boolean }
                          skipped: { type: boolean }
                          score: { type: integer, nullable: true, minimum: 1, maximum: 7 }
                          question: { type: string }
                          scale: { type: object, properties: { min: { type: integer }, max: { type: integer }, minLabel: { type: string }, maxLabel: { type: string } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: '非会话归属者（code=1003）', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 会话不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
    post:
      operationId: craftSessionCalibrationSubmit
      summary: 提交单题自评或明确跳过（阶段 1-1）
      description: 'body 二选一：{ "score": 1~7 } 作答，或 { "skip": true } 跳过。跳过同样落库（区分「没看到」与「看到了不答」），跳过之后仍允许补答；已作答后重复提交 → code=3001；未被抽中 → code=3001；评分越界或两字段都空 → code=1001。写入行为自评数据，挂隐私同意门（与心跳/事件同口径）。'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: '会话 ID（雪花，字符串）' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, minimum: 1, maximum: 7, description: '自评分数；与 skip 二选一' }
                skip: { type: boolean, description: '明确跳过；与 score 二选一' }
      responses:
        '200':
          description: '提交后的校准状态（同 GET）；已作答重复提交 / 未抽中返回 HTTP 200 + code=3001'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '400': { description: '评分越界或 score/skip 都空（code=1001）', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '403': { description: '非会话归属者或未同意隐私政策（code=1003）', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 会话不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '405': { description: 请求方法不支持（code=1005）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

