                      total: { type: integer, format: int64 }
                      pageNum: { type: integer }
                      pageSize: { type: integer }
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64, description: 'inheritor_profile.id' }
                            userId: { type: integer, format: int64 }
                            nickname: { type: string }
                            skill: { type: string }
                            honor: { type: string }
                            intro: { type: string }
                            avatarUrl: { type: string, nullable: true }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/inheritors/{id}:
    get:
      operationId: inheritorGet
      summary: 查询传承人详情
      description: '登录用户均可访问。id 为 inheritor_profile.id。未认证传承人返回 1004。'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 传承人详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      userId: { type: integer, format: int64 }
                      nickname: { type: string }
                      skill: { type: string }
                      honor: { type: string }
                      intro: { type: string }
                      avatarUrl: { type: string, nullable: true }
                      school: { type: string, nullable: true }
                      workCount: { type: integer, format: int64, description: '作品数（status=1）' }
                      fanCount: { type: integer, format: int64, description: '粉丝数（当前无粉丝表，固定 0）' }
                      likeCount: { type: integer, format: int64, description: '获赞数（SUM(like_count))' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004，传承人不存在或未认证）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/inheritors/{id}/projects:
    get:
      operationId: inheritorProjectPublicList
      summary: 查询传承人的已上架项目列表
      description: '登录用户均可访问。id 为 inheritor_profile.id。先查 user_id 再查 craft_project WHERE inheritor_id=user_id AND status=1。'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: 传承人已上架项目分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      total: { type: integer, format: int64 }
                      pageNum: { type: integer }
                      pageSize: { type: integer }
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            title: { type: string }
                            intro: { type: string }
                            coverUrl: { type: string, nullable: true }
                            category: { type: string }
                            level: { type: integer }
                            estMinutes: { type: integer }
                            therapyTags: { type: string }
                            createTime: { type: string, format: date-time }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004，传承人不存在或未认证）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/craft/projects/{id}:
    get:
      operationId: craftProjectGet
      summary: 查询已上架项目详情（含步骤+材料+传承人信息）
      description: '登录用户均可访问。id 为 craft_project.id。未上架项目返回 1004。'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      title: { type: string }
                      intro: { type: string }
                      cultureBg: { type: string }
                      level: { type: integer }
                      estMinutes: { type: integer }
                      category: { type: string }
                      therapyTags: { type: string }
                      coverUrl: { type: string, nullable: true }
                      createTime: { type: string, format: date-time }
                      inheritorId: { type: integer, format: int64 }
                      inheritorProfileId: { type: integer, format: int64, description: 'inheritor_profile.id，用于跳转传承人主页' }
                      inheritorNickname: { type: string }
                      inheritorSkill: { type: string }
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            stepNo: { type: integer }
                            title: { type: string }
                            guide: { type: string }
                            audioUrl: { type: string, nullable: true }
                      materials:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            name: { type: string }
                            qty: { type: string }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004，项目不存在或未上架）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '500': { description: 服务器内部错误（code=5000）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 用户隐私合规（M3-B1） ----------
  /api/user/privacy/status:
    get:
      operationId: userPrivacyStatus
      summary: 查询当前用户的隐私政策状态
      description: '返回 privacyAgreed 与 canContact 两个字段'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 隐私状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrivacyStatusVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/privacy/agree:
    post:
      operationId: userPrivacyAgree
      summary: 同意隐私政策
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 同意成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/privacy/withdraw:
    post:
      operationId: userPrivacyWithdraw
      summary: 撤回隐私政策同意（同时取消可联系）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 撤回成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/can-contact:
    put:
      operationId: userCanContactUpdate
      summary: 更新可联系状态（仅本人可调）
      description: '设为 1 时需已同意隐私政策，否则返回 1001'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanContactReq' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001，未同意隐私政策）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/delete:
    post:
      operationId: userDelete
      summary: 注销账号（匿名化 + 逻辑删除）
      description: '需 confirm=true 二次确认；匿名化敏感字段后逻辑删除，不物理删除'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountReq' }
      responses:
        '200': { description: 注销成功, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { description: 参数校验失败（code=1001，confirm 非 true）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/profile:
    put:
      operationId: userProfileUpdate
      summary: 更新个人资料（昵称、头像、学校、简介）
      description: '只更新非 null 字段。需认证。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdateReq' }
      responses:
        '200':
          description: 更新成功，返回最新用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserVO' }
        '400': { description: 参数校验失败（code=1001）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '404': { description: 资源不存在（code=1004）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/password:
    put:
      operationId: userPasswordUpdate
      summary: 修改密码
      description: '校验旧密码后更新为新密码。JWT 无状态，修改后当前 token 仍有效。旧密码不匹配返回 2001。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeReq' }
      responses:
        '200':
          description: '成功（code=0）；旧密码错误时 code=2001'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '400': { description: 参数校验失败（code=1001，新密码长度不合规）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  /api/user/stats:
    get:
      operationId: userStats
      summary: 学生端「我的」统计数据
      description: '返回注册天数、作品数、便签数'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserStatsVO' }
        '401': { description: 未登录或登录已过期（code=1002）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResult' } } } }

  # ---------- 心理援助热线（M3-B1，公开接口） ----------
  /api/crisis/hotlines:
    get:
      operationId: crisisHotlines
      summary: 获取心理援助热线信息
      description: '公开接口，未登录也能访问，用于登录页与危机干预页展示'
      security: []
      responses:
        '200':
          description: 热线信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HotlinesVO' }

    InheritorProfileSelfVO:
      type: object
      description: 传承人自己的资料返回体
      properties:
        id: { type: integer, format: int64, description: inheritor_profile 主键 }
        userId: { type: integer, format: int64, description: 关联用户 ID }
        skill: { type: string, description: 擅长技艺 }
        intro: { type: string, description: 个人简介 }
        honor: { type: string, description: 荣誉头衔 }
        verified: { type: integer, description: '0 未认证 / 1 已认证' }
        avatarUrl: { type: string, description: '头像 URL（来自 user 表）' }

    InheritorProfileSelfUpdateReq:
      type: object
      description: 传承人自更新资料请求体（所有字段可选，null 表示不更新）
      properties:
        skill: { type: string, maxLength: 100, description: 擅长技艺 }
        intro: { type: string, maxLength: 500, description: 个人简介 }
        honor: { type: string, maxLength: 255, description: 荣誉头衔 }
        avatarUrl: { type: string, maxLength: 255, description: '头像 URL，非空时同步更新 user.avatar_url' }

    UserStatsVO:
      type: object
      description: 学生端「我的」统计数据
      properties:
        daysSinceRegister: { type: integer, format: int64, description: '注册天数（今天注册返回 1）' }
        workCount: { type: integer, format: int64, description: '作品数' }
        noteCount: { type: integer, format: int64, description: '便签数' }