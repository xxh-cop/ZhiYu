spring:
  datasource:
    # 一律走环境变量，不硬编码任何真实密码
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhiyu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 本地开发默认值；生产/演示环境必须通过 DB_PASSWORD 环境变量覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 织愈自定义配置（dev profile 补充）
zhiyu:
  crypto:
    # 开发用密钥（base64 编码的 32 字节），生产环境用 FIELD_ENCRYPT_SECRET 覆盖。
    # 属于"仓库内置默认密钥"：必须显式设置环境变量 ZHIYU_CRYPTO_ALLOW_DEFAULT_SECRET=true
    # 才允许启用，否则启动失败（防止默认密钥被静默带进生产/演示环境）。
    secret: ${FIELD_ENCRYPT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LWtleS0zMmJ5dGVzISE=}
  auth:
    password-reset:
      # 本地开发默认把重置令牌打印到服务端日志；生产必须关闭（none）或接入真实通道
      channel: ${ZHIYU_PASSWORD_RESET_CHANNEL:log}
