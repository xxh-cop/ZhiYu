spring:
  datasource:
    # 一律走环境变量，不硬编码任何真实密码
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhiyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 本地开发默认值；生产/演示环境必须通过 DB_PASSWORD 环境变量覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
