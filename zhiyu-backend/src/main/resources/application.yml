server:
  port: 8080

spring:
  application:
    name: zhiyu
  profiles:
    active: dev

  # ── Spring AI（T1.1a 引入） ──
  # DeepSeek 兼容 OpenAI API 规范，只需改 base-url。
  # API Key 只通过环境变量 DEEPSEEK_API_KEY 注入，默认 sk-placeholder 仅占位。
  # 当 api-key=sk-placeholder 时，SpringAiLlmClient 不生效（@ConditionalOnProperty），
  # MockLlmClient 接管，应用仍能正常启动。
  ai:
    # 禁用 OpenAI Embedding 自动配置（DeepSeek 不提供 embedding 服务，
    # 自动配置的 openAiEmbeddingModel 不可用且与自定义 DoubaoEmbeddingModel 冲突）
    model:
      embedding: none
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 600
      # 织愈只用 chat model，禁用其他 OpenAI 模型的自动装配
      #（避免无 key 时 AudioSpeech / Transcription / Image / Moderation 报错）
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      image:
        enabled: false
      moderation:
        enabled: false

    # 禁用 Spring AI 默认向量库自动配置（M3-3：使用自定义 SimpleVectorStore）
    vector-store:
      enabled: false

  # ── Redis（T1.1b 用：熔断状态存储。本批次只配连接） ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

# 织愈自定义配置
zhiyu:
  jwt:
    # HS256 签名密钥，至少 32 字节。默认值是「仅本地开发」用的假密钥，
    # 生产/演示环境必须通过环境变量 JWT_SECRET 覆盖（见 .env.example）。
    # 密钥长度不足时 JwtUtil 构造失败 → 应用启动即报错，不会带着弱密钥跑起来。
    secret: ${JWT_SECRET:zhiyu-local-dev-only-secret-0123456789abcdef}
    # token 有效期（小时），与 .env.example 的 JWT_EXPIRE_HOURS 对应
    expire-hours: ${JWT_EXPIRE_HOURS:12}

  # ── AI 配置（T1.1b 熔断器 + M3-3 豆包 Embedding / RAG） ──
  # store: redis（多实例共享） | memory（单机，默认）
  # 本地开发可通过环境变量 ZHIYU_AI_RESILIENCE_STORE=memory 切换
  ai:
    resilience:
      store: ${ZHIYU_AI_RESILIENCE_STORE:memory}
      failure-threshold: 5
      open-duration-seconds: 60
    # 豆包 Embedding API（M3-3：RAG 非遗知识库）
    # API Key 只通过环境变量 DOUBAO_API_KEY 注入，不硬编码
    doubao:
      api-key: ${DOUBAO_API_KEY:placeholder}
      embedding:
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-embedding-vision-251215
        dimensions: 2048
    rag:
      vector-store-path: ${ZHIYU_RAG_STORE_PATH:./rag-store.json}
    # 成本估算费率：只用于运营页展示，实际以供应商账单为准；0 表示未配置。
    cost:
      input-per-million: ${AI_INPUT_COST_PER_MILLION:0}
      output-per-million: ${AI_OUTPUT_COST_PER_MILLION:0}
      currency: ${AI_COST_CURRENCY:CNY}

    # ── 任务分档模型路由（2026-11-04，B2） ──
    # strong 档用于倾听小结等声明任务；与 standard 同 endpoint/key，仅切模型名。
    # 危机干预不路由（crisis=none，见 ai-config/ai-capabilities.yaml routing 段）。
    routing:
      strong-model: ${DEEPSEEK_STRONG_MODEL:deepseek-reasoner}
      strong-enabled: ${ZHIYU_STRONG_TIER_ENABLED:true}

  # ── 字段加密密钥（T1.3a） ──
  # Base64 编码的 32 字节密钥。为空时启动失败（fail-fast）。
  # 生产/演示环境必须通过环境变量 FIELD_ENCRYPT_SECRET 覆盖。
  crypto:
    secret: ${FIELD_ENCRYPT_SECRET:}

  # ── 情绪对话配置（T1.3a） ──
  emotion:
    max-history-turns: 10
    # AM1（2026-11-04）情绪基线偏离提醒（只做提醒不做判断；依据见 EmotionBaselineService javadoc）
    baseline:
      enabled: ${ZHIYU_EMOTION_BASELINE:true}   # 全局开关；用户级 user.baseline_nudge_enabled 可单独关
      short-window-days: 3       # 近期窗口
      long-window-days: 28       # 基线窗口（不含近期窗口）
      min-history-records: 8     # 冷启动防误报：历史+近期总样本下限
      min-recent-records: 3      # 近期样本下限
      share-uplift: 0.30         # 低落类占比位移阈值（0.30 ≈ 占比上移三分之一）
      cooldown-hours: 72         # 同档位冷却
      heavy-moods: depressed     # 低落类情绪 code（逗号分隔，词表见 dict_mood）

  # ── 推荐反馈回灌（AM2 2026-11-04；确定性加权，接在规则层之后） ──
  recommend:
    feedback:
      enabled: ${ZHIYU_RECOMMEND_FEEDBACK:true}  # 回滚：置 false 后排序与规则层逐条一致
      window-days: 90            # 反馈窗口
      min-events: 3              # 稀疏保护：本人反馈少于此数不加权
      click-weight: 0.15         # 正反馈权重（CLICK）
      dismiss-weight: 0.15       # 负反馈权重（DISMISS）
      decay-per-day: 0.98        # 按事件年龄（天）衰减
      cap: 0.6                   # 单项目加权上限（防一条反馈翻掉整个列表）

  # ── 账号安全（2026-11-03：登录失败锁定 + 忘记密码） ──
  # 登录失败锁定：按账号维度计数（不存在的账号同样计数，避免探测注册状态），
  # 窗口内连续失败 max-failures 次锁定 lock-minutes 分钟；主存储 Redis，异常降级内存。
  auth:
    login-attempt:
      # store: redis（多实例共享，默认） | memory（单机/单测）
      store: ${ZHIYU_LOGIN_ATTEMPT_STORE:redis}
      max-failures: 5
      window-minutes: 15
      lock-minutes: 15
    password-reset:
      # store: redis（默认） | memory（单机/单测）
      store: ${ZHIYU_PASSWORD_RESET_STORE:redis}
      # 发送通道：none=未配置（申请时返回「该功能暂未开放」）；
      # log=令牌打印到服务端日志（仅供本地开发，生产禁止）。
      channel: ${ZHIYU_PASSWORD_RESET_CHANNEL:none}
      # 一次性重置令牌有效期（秒），默认 30 分钟
      token-expire-seconds: 1800

  # ── SSE 流式对话线程池（2026-11-03 压测修复） ──
  # core=max=16：让 max 真正生效（Spring 线程池「core 满→入队→队列满才扩」，
  # 大队列会让 max 永远用不上）；queue=32 仅作超过 16 并发时的短突发缓冲。
  sse:
    executor:
      core-size: ${ZHIYU_SSE_CORE_SIZE:16}
      max-size: ${ZHIYU_SSE_MAX_SIZE:16}
      queue-capacity: ${ZHIYU_SSE_QUEUE_CAPACITY:32}

  # ── 危机干预配置（T1.3b） ──
  # 高危命中后返回给用户的关怀话术中包含的热线号码。
  # 默认值仅本地开发用，生产/演示环境必须通过环境变量覆盖。
  crisis:
    psych-center-phone: ${PSYCH_CENTER_PHONE:0791-88120129}
    psych-center-name: ${PSYCH_CENTER_NAME:江西师范大学心理教育中心}
    national-hotline: ${NATIONAL_HOTLINE:12356}
    national-hotline-name: ${NATIONAL_HOTLINE_NAME:全国心理援助热线}

  # ── 语音服务商（gateway=qianwen 二选一） ──
  speech:
    provider: ${SPEECH_PROVIDER:gateway}

  # ── 心流检测配置（T1.7） ──
  # store: redis（多实例共享） | memory（单机，默认）
  # 阈值与 ai-config/ai-capabilities.yaml 的 flow 段对应
  flow:
    store: ${ZHIYU_FLOW_STORE:memory}
    focus-idle-seconds: 300
    stuck-repeat-times: 3
    # ── 心流自评校准（阶段 1-1，2026-11-05） ──
    # 会话 finish 时按 sample-rate 抽样落库（wellbeing_record，可追溯、稳定）；
    # 管理端聚合自评与「专注停留占比」的 Spearman 相关，效度不足时指标名降级
    calibration:
      enabled: ${ZHIYU_FLOW_CALIBRATION_ENABLED:true}
      sample-rate: ${ZHIYU_FLOW_CALIBRATION_SAMPLE_RATE:0.2}
    # 疑似离席判定（2026-11-05 心流度量修复）：只标记不扣除 flow_seconds。
    # 不要求输入事件；强信号走生命周期；前台静置默认算沉浸。
    away:
      # 同一步骤停留须超过「同类步骤 P95 × 该倍数」才可能标记
      p95-multiplier: 2.0
      # P95 估计的最小样本量，不足不判定（冷启动期不标记）
      min-samples: 30
      # 绝对地板：停留低于该秒数一律不判定
      floor-seconds: 300
      # P95 样本截取上限（按发生时刻倒序）
      sample-limit: 500

  # ── 分层下架状态机（2026-11-05） ──
  # 合规下架：公开面即收，进行中/暂停会话转只读，export-window-hours 内可导出，窗口结束转归档。
  # 运营下架：存量会话不受影响，一直运行到 archive_at（请求必填，管理端按 default-deadline-days 预填）。
  takedown:
    export-enabled: ${ZHIYU_TAKEDOWN_EXPORT_ENABLED:true}
    compliance:
      export-window-hours: 72
    operational:
      # 产品红线：最小 7 天；绑定期校验，配置更小的值启动即失败
      default-deadline-days: 14

  # ── 文件上传配置（批次 2） ──
  file:
    upload-dir: ${ZHIYU_UPLOAD_DIR:./uploads}
    access-prefix: /uploads
    image-extensions: jpg,jpeg,png,webp
    video-extensions: mp4,mov
    image-max-size: 5242880       # 5MB
    video-max-size: 52428800      # 50MB

  # ── 双对话收敛开关（P0 2026-11-04；AK 批细粒度化；2026-11-05 阶段 2 起默认开启） ──
  # 数值见 ai-config/ai-capabilities.yaml dialogue 段；危机路径永久直连（无开关，两路径都先过安检、零 LLM）
  # 一键回落：环境变量置 false 即回旧路径（旧实现保留，不删）；@Value 代码级默认 false 为配置缺失时的安全失败方向
  dialogue:
    commander: ${ZHIYU_DIALOGUE_COMMANDER:true}              # C1 端点 /api/dialogue/chat 注册（物理入口）
    listening-via-commander: ${ZHIYU_DIALOGUE_LISTENING_COMMANDER:true}  # AK1：倾听链 /api/emotion/chat 委托调度层（协议零破坏）
    companion-adapter: ${ZHIYU_DIALOGUE_COMPANION_ADAPTER:false}  # P3 companion 薄适配器（预留，当前未接线，保持关闭）
    rolling-summary: ${ZHIYU_DIALOGUE_ROLLING_SUMMARY:true}       # P1b 滚动摘要（仅倾听链；失败降级保留原文窗口）
    # P1b 滚动摘要参数（与 ai-config/ai-capabilities.yaml dialogue.rolling_summary 段一致）
    summary-trigger-turn: 11      # 第 N 条消息起允许触发
    summary-increment-turns: 5    # 每滑出 N 条增量压缩一次
    summary-ttl-days: 90          # 摘要滚动过期天数（到期视为无摘要）
    # P2 调度层三道闸（AA 批 2026-11-04；数值与 ai-config/ai-capabilities.yaml dialogue.guards 段一致）
    guard-store: ${ZHIYU_DIALOGUE_GUARD_STORE:redis}   # redis|memory；Redis 连续失败 3 次冷却 30s 降级内存
    repeat-intent-times: 3         # 重复意图锁定阈值（同哈希次数）
    repeat-window-seconds: 600     # 重复意图窗口（秒）
    oscillation-lock: true         # A→B→A 振荡锁定
    session-turn-budget: 30        # 会话轮次预算（超出给收尾文案）
    turn-wall-clock-ms: 30000      # 单轮墙钟预算（超出记 TURN_TIMEOUT，不阻断回包）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由应用侧雪花算法生成，DDL 不设 AUTO_INCREMENT（AGENTS.md §5）
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
