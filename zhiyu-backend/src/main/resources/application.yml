server:
  port: 8080

spring:
  application:
    name: zhiyu
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由应用侧雪花算法生成，DDL 不设 AUTO_INCREMENT（AGENTS.md §5）
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
