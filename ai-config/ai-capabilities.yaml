# 织愈 AI 能力配置清单
# 机器可读、可校验；说明性文字放 AGENTS.md / project-context.md

ai:
  default_provider: deepseek        # deepseek | qwen | ollama-local
  providers:
    deepseek:
      endpoint: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      chat_model: deepseek-chat
      timeout_ms: 20000
      max_output_tokens: 600
    qwen:
      endpoint: ${QWEN_BASE_URL}
      api_key: ${QWEN_API_KEY}
      chat_model: qwen-plus
    ollama-local:
      endpoint: http://localhost:11434
      chat_model: qwen2.5:7b
      note: 本地化部署模式，数据不出校园

  # 对话
  chat:
    stream: true
    first_token_timeout_ms: 2000     # 需求规格 NFR-02 上限
    system_prompt: prompts/companion.st
    temperature: 0.7
    max_history_turns: 10

  # 推荐（规则 + LLM 混合）
  recommendation:
    rule_first: true
    rules:
      - mood: anxious
        prefer_tags: [静心, 专注, 安抚]
      - mood: stressed
        prefer_tags: [放空, 释放, 触觉安抚]
      - mood: depressed
        prefer_tags: [成就感, 陪伴, 创造表达]
      - mood: angry
        prefer_tags: [物理宣泄, 释放, 触觉安抚]
      - mood: tired
        prefer_tags: [轻量成就, 安抚, 陪伴]
    llm:
      enabled: true
      purpose: 生成个性化推荐理由与引导语，不决定选品
      prompt: prompts/recommend.st
    # AM2（2026-11-04）反馈回灌加权：确定性规则，接在规则层之后；数值以 application.yml
    # zhiyu.recommend.feedback.* 为运行承载（enabled/window-days/min-events/click-weight/
    # dismiss-weight/decay-per-day/cap）。稀疏（<min-events）或关闭时排序与规则层逐条一致。
    feedback_boost:
      enabled: true
      note: 仅用本人 craft_recommend_event（CLICK 正 / DISMISS 负），不使用便签/对话等敏感内容

  # AM1（2026-11-04）情绪基线偏离提醒：只做提醒不做判断；口径与默认值以
  # application.yml zhiyu.emotion.baseline.* 为运行承载（依据见 EmotionBaselineService javadoc）。
  emotion_baseline:
    enabled: true
    note: 低落类占比位移（近期 3 天 vs 基线 28 天）≥0.30 且样本达标才提示；冷却 72h；用户可关

  # 作品寄语
  work_message:
    enabled: true
    prompt: prompts/work_message.st

  # 心流
  flow:
    focus_idle_seconds: 300          # 连续 5 分钟无步骤切换 = 心流
    stuck_repeat_times: 3            # 同一步骤停留超过该值（>3）才判定焦躁
    breathing:
      inhale_ms: 4000
      exhale_ms: 6000
    # 疑似离席判定（2026-11-05 心流度量修复）：只标记不扣除 flow_seconds
    away:
      p95_multiplier: 2.0            # 同一步骤停留须超过同类步骤 P95 × 该倍数
      min_samples: 30                # P95 估计最小样本量，不足不判定
      floor_seconds: 300             # 绝对地板，低于该秒数不判定
      sample_limit: 500              # P95 样本截取上限（按发生时刻倒序）

  # 内容安全
  safety:
    input_filter: true
    output_filter: true
    policy: prompts/safety.st
    on_block: safe_reply
    log_to: ai_audit_log
    high_risk_lexicon: lexicon/high-risk.txt   # 高危词库，外置，不硬编码在配置里

  # 熔断与降级（按资源 key 隔离）
  resilience:
    failure_threshold: 5
    open_seconds: 60
    half_open_probe: true
    resources:
      - llm-chat
      - llm-recommend
      - llm-message
      - llm-strong        # strong 档（倾听小结等）独立熔断，2026-11-04 B2 注册
      - llm-summary       # 上下文滚动摘要（P1b，standard 档）独立熔断，2026-11-04 注册
      - llm-moderation    # 审核辅助建议（BL，strong→standard 链共用）独立熔断，2026-11-05 注册
      - asr
      - tts
    fallback:
      llm-chat: 缓存图文陪伴话术
      llm-recommend: 纯规则推荐
      llm-strong: 回落 standard 档（见 routing.fallback_chain）
      llm-summary: 本轮不做摘要，保留原文窗口（不阻断对话，记 ai_trace）
      asr: 提示用户改用文字输入
      tts: 静默，仅展示文字

  # 任务分档模型路由（2026-11-04，B2：最小静态映射，不做动态打分路由）
  routing:
    policy: task_tier
    tiers:
      standard:
        provider: deepseek
        model: deepseek-chat       # 日常对话、推荐、寄语、RAG、陪伴编排
      strong:
        provider: deepseek
        model: deepseek-reasoner   # 倾听小结、（预留）内容审核辅助；同 endpoint/key
      qwen:
        provider: qwen
        model: qwen-plus
        available: false           # QWEN_BASE_URL/QWEN_API_KEY 未配置（.env 无此变量），显式不可用
      embedding:
        provider: doubao           # 独立于对话档位
    tasks:
      crisis: none                 # 红线：危机干预不走 LLM，直接返回预置干预话术
      chat: standard               # 日常情绪对话（含 SSE live）
      companion: standard          # 陪伴编排计划
      recommend: standard          # 推荐理由
      message: standard            # 作品寄语 / 创作回顾
      listening_summary: strong    # 倾听小结走强档
      moderation: strong           # 内容审核辅助（预留，当前无 LLM 调用点）
      rag: standard                # 非遗问答
    fallback_chain:
      # 每档失败显式回落并记 WARN 日志，不静默降级
      strong: [standard, cached_template]
      standard: [cached_template]

  # 双对话收敛（dialogue-unification-20261104；P0 骨架 2026-11-04；2026-11-05 阶段 2 起三开关默认开启）
  # 数值与文档 §2.3/§2.4/§3 一致；各期开关由 zhiyu.dialogue.*（application.yml）承载默认值。
  dialogue:
    commander:
      enabled: true            # C1 端点 /api/dialogue/chat 注册（zhiyu.dialogue.commander；2026-11-05 起默认开）
    listening_via_commander:
      enabled: true            # AK1：倾听链委托调度层（zhiyu.dialogue.listening-via-commander；2026-11-05 起默认开）；与端点注册解耦，可只放倾听
      note: 危机路径永久直连、无开关——两路径都先过内容安检、零 LLM（用户拍板 2026-11-04）
    companion_adapter:
      enabled: false           # P3 companion 薄适配器开关（/api/companion/sessions/{id}/message 转调度层；预留未接线）
    rolling_summary:
      enabled: true            # P1b 滚动摘要开关（仅倾听链；2026-11-05 起默认开）
      trigger_turn: 11         # 第 11 轮起触发
      increment_turns: 5       # 每新增 5 轮，把滑出原文窗口的最旧 5 轮增量压缩进摘要
      ttl_days: 90             # 摘要滚动过期
    routing_rules:
      enabled: false           # 规则路由总开关（可热改）；模型分类器不进上线路径（决策②）
      rules:
        - { priority: 0, when: input_safety_blocked, route: CRISIS, note: 预置干预话术，不进 LLM；记 care_reminder + ai_audit_log + trace(ROUTE_CRISIS) }
        - { priority: 1, when: entry_context=PRACTICE_PAGE && practice_session_active, route: PRACTICE_COMPANION, note: 现 CompanionOrchestrator 逻辑原样迁入 }
        - { priority: 2, when: entry_context=KNOWLEDGE_PAGE, route: KNOWLEDGE, note: 现 RagService/KnowledgeAskService 链 }
        - { priority: 3, when: explicit_intent_hint, route: HINTED_CAPABILITY, note: 前端随请求带 intentHint 的显式快捷动作 }
        - { priority: 4, when: default, route: LISTENING, note: 最安全默认——无工具、无执行副作用；规则引擎异常同样回落 LISTENING 并记 trace(ROUTE_FALLBACK) }
    guards:
      max_route_depth: 1       # 闸①深度上限：路由 1 次 + 子能力执行 1 次，子能力返回值不进二次路由
      repeat_intent_times: 3   # 闸②重复意图：规范化文本哈希同哈希 ≥N 次/窗口 ⇒ 锁定当前子能力
      repeat_window_seconds: 600
      oscillation_lock: true   # 3 轮内 A→B→A 振荡 ⇒ 本轮强制留在 A（trace: REPEAT_INTENT_LOCK）
      session_turn_budget: 30  # 闸③每会话 LLM 轮次预算（trace: BUDGET_EXHAUSTED）
      turn_wall_clock_ms: 30000  # 单轮调度层墙钟预算（SSE 总超时 120s 内；trace: TURN_TIMEOUT）

  # RAG 非遗知识库（当前为本地文件向量存储 + 目录关系检索，不是已部署 Chroma/Milvus）
  rag:
    enabled: true
    vector_store: local_file
    graph_retrieval: heritage_catalog
    collection: zhiyu_crafts
    top_k: 3
    rerank: keyword_overlap

  # 语音（SPEECH_PROVIDER=gateway | qianwen）
  voice:
    provider: ${SPEECH_PROVIDER:gateway}
    qianwen:
      asr_model: fun-asr-flash-2026-06-15
      tts_model: qwen-audio-3.1-tts-flash
      tts_voice: longanhuan_v3.1
      endpoint: https://maas.qianwenaiapi.com/api/v1
    gateway:
      protocol: ZHIYU_JSON_GATEWAY_V1
